openapi: 3.1.0
info:
  title: KysoQR API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    KysoQR's HTTP API: sign PDFs via QR code (through CAS e-sign) and verify the digital signatures in a PDF.

    Written for both developers and AI agents. This spec is the source of truth for requests/responses;
    if it disagrees with the code, the code wins (every endpoint lists its source files). Download the spec:
    [`/openapi/en.yaml`](/openapi/en.yaml) · [`/openapi/vi.yaml`](/openapi/vi.yaml) — both import straight into Postman.

    ## End-to-end signing flow

    1. `POST /api/sign/request` → get `signRequestId`, `qrContent`.
    2. Render `qrContent` as a QR code; the signer scans it with the **Cas ID** app and approves.
    3. `GET /api/sign/status?signRequestId=…` — poll every 4 seconds (on `429`, wait per `Retry-After`).
       `PENDING`/`ACCEPTED` → keep polling; `SIGNED` → `identityKey`, `orgIdSigned` available; `REJECTED`/`FAILED`/`EXPIRED` → stop.
    4. `GET /api/sign/download?identityKey=…` → the signed PDF.
    5. (optional) `GET /api/verify/signing-round/{orgIdSigned}` → CAS's record of the signing round.
    6. (optional) `POST /api/verify/upload` with the downloaded file → cryptographic signature verification.

    ## Common conventions

    - **Authentication:** none. Every route is public. No CORS headers, so browsers can only call from the same origin; other servers can call directly.
    - **Error body:** `{ error, message, detail? }` (schema `ApiError`). Branch on `error`, not on `message`.
      `detail` only appears on `502` errors from routes that call CAS; it's absent when the error didn't come from CAS and wasn't a timeout.
    - **Per-IP rate limits** (sign/request 20, sign/status 60, sign/download 20, verify/upload 20, verify/signing-round 30 requests / 60 seconds).
      Exceeding one → `429 RATE_LIMITED` with a `Retry-After` header. The IP comes from `CF-Connecting-IP`, otherwise the last entry of `X-Forwarded-For`.
      Counters live in each server process's memory. Not the same as `429 CAS_RATE_LIMITED` (CAS limiting KysoQR's account, no `Retry-After`).
    - **Missing CAS configuration:** the 4 routes that call CAS return `500 CAS_NOT_CONFIGURED` if the server lacks `CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID` or `CAS_ESIGN_API_KEY`. `POST /api/verify/upload` doesn't need them.

    ## CAS e-sign integration

    KysoQR doesn't sign anything itself; signing (private key, HSM) is done by CAS e-sign. CAS's official docs:
    [cas.so/general/api/product-esign](https://cas.so/general/api/product-esign).

    | KysoQR route | CAS API | Timeout |
    |---|---|---|
    | `POST /api/sign/request` | `POST /esign/request-document` (multipart) | 30 seconds |
    | `GET /api/sign/status` | `POST /esign/request-status` | 10 seconds |
    | `GET /api/sign/download` | `POST /esign/download-file` | 30 seconds |
    | `GET /api/verify/signing-round/{orgIdSigned}` | `GET /esign/signing-round/{orgIdSigned}` | 10 seconds |

    - Headers sent to CAS: `x-client-id` = `CAS_ESIGN_CLIENT_ID`, `x-secret-key` = `CAS_ESIGN_API_KEY`. No automatic retries.
    - CAS's official states: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`. `FAILED`/`CANCELLED`/`CANCELED`/`EXPIRED` are handled defensively only.
    - `identityKey`/`identityKeyExpiresAt` are only set when `COMPLETED`. `orgIdSigned` and `expiresIn` aren't officially documented by CAS.
    - Y-axis flip: KysoQR uses the top edge from the page top; CAS uses the bottom edge from the page bottom: `yRatio_CAS = 1 − yRatio − heightRatio` (`SignatureField.toCasConvention()`).
    - `documentName` = file name without `.pdf`, control characters removed, max 240 characters; shorter than 10 gets ` - KysoQR` appended (`lib/documentName.ts`).
    - CAS errors with special handling: HTTP 429 → `CAS_RATE_LIMITED`; `E_SIGN_PERSON_NOT_FOUND` → automatic QR-only resubmit;
      `E_SIGN_CERTIFICATE_NOT_FOUND` → `CAS_CERTIFICATE_NOT_FOUND`; `E_SIGN_SIGNING_ROUND_NOT_FOUND` → `200 { signingRound: null }`.
    - Server egress: the host in `CAS_ESIGN_BASE_URL`, plus the AIA/OCSP/CRL hosts listed on certificates (via `lib/verification/guardedFetch.ts`, which blocks internal IPs).

    Source: `lib/cas/CasEsignProvider.ts`, `lib/cas/casPayload.ts`, `lib/casErrorDetail.ts`, `lib/mapCasState.ts`, `lib/env.ts`.

    ## Signing with VNeID (CMC's CSign Gateway)

    1. `POST /api/vneid/sign` (PDF, CCCD, boxes) → `transactionId`, `clientSecret`, `confirmDeadline`, `expiresAt`.
       The signer gets a notification in the **VNeID** app and has 5 minutes to confirm.
    2. `POST /api/vneid/status` with `Authorization: Bearer <clientSecret>` until `status` is `SIGNED` (or final).
    3. `POST /api/vneid/finalize` with exactly the original PDF → the signed PDF.

    CSign reports results to the server through `POST /api/vneid/webhook`. The VNeID routes are public but only accept
    requests whose `Origin` is the KysoQR site; every response carries `Cache-Control: no-store`. Not configured → `503 VNEID_NOT_CONFIGURED`.
  contact:
    name: KysoQR on GitHub
    url: https://github.com/KysoQR/KysoQR

servers:
  - url: /
    description: The server hosting this page

tags:
  - name: Signing
    description: Create signing requests, track their status and download signed files via CAS e-sign.
  - name: Verification
    description: Verify the digital signatures in a PDF and look up signing rounds.
  - name: VNeID signing
    description: Sign PDFs with the certificate in the VNeID app, through CMC's CSign Gateway.

paths:
  /api/sign/request:
    post:
      tags: [Signing]
      operationId: createSignRequest
      summary: Create a signing request
      description: |
        Creates a signing request on CAS for one PDF and returns the QR content for the signer to scan with the **Cas ID** app.
        `signRequestId` is generated by KysoQR (UUID v4). The server stores nothing: the file goes straight to CAS within the same request.

        If `identificationNumber` is set and CAS returns `E_SIGN_PERSON_NOT_FOUND` (the ID isn't registered with Cas ID),
        the server resubmits **once** as QR-only, keeping the same `signRequestId`; the caller still gets `200`.

        **Note:** trying this request out creates a real signing request on CAS.

        Source: `app/api/sign/request/route.ts`, `lib/domain/SignatureField.ts`, `lib/domain/CasSignerConfig.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, signatureFields]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The PDF to sign, max **10 MiB** (10485760 bytes, CAS's limit).
                    Must satisfy all 3: name ends in `.pdf`, content type `application/pdf`, first 5 bytes are `%PDF-`.
                signatureFields:
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/SignatureFieldInput'
                  description: |
                    JSON array of signature boxes (see schema `SignatureFieldInput`). At least 1; no limit per page.
                    Coordinates are 0–1 fractions, origin at the page's top-left corner.
                  example: '[{"page":1,"xRatio":0.52,"yRatio":0.78,"widthRatio":0.34,"heightRatio":0.1}]'
                signerType:
                  type: string
                  enum: [individual, enterprise]
                  default: individual
                  description: Signer type. Any other value → `400 INVALID_SIGNER_CONFIG`.
                identificationNumber:
                  type: string
                  pattern: '^\d{9}$|^\d{12}$'
                  description: |
                    National ID: CCCD (12 digits) or CMND (9 digits). When set, CAS also sends a push notification to that person's Cas ID app.
                    Leave empty for QR only. Deliberately has no sample value, so a request copied from these docs never notifies a real person by accident.
                taxCode:
                  type: string
                  pattern: '^\d{10}$|^\d{10}-\d{3}$'
                  description: Tax code. **Required when `signerType=enterprise`** (missing → `400 INVALID_SIGNER_CONFIG`, message `taxCode is required for enterprise signers`); ignored for individuals. 10 digits, or 10 digits + `-` + 3 digits.
                organizationName:
                  type: string
                  description: Organization name, only used when `signerType=enterprise`. Sent to CAS when non-empty.
                representativeName:
                  type: string
                  description: Legal representative, only used when `signerType=enterprise`. Validated but **never sent to CAS**.
                language:
                  type: string
                  enum: [vi, en]
                  default: vi
                  description: Display language on the CAS side. Any other value → `400 INVALID_LANGUAGE`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Signing request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
              examples:
                success:
                  summary: Success
                  value:
                    signRequestId: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
                    qrContent: https://scan2grant.bankhub.vn?signToken=eyJhbGciOi...
                    state: NEW
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalid_pdf:
                  summary: Not a PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                too_large:
                  summary: File over 10 MiB
                  value: { error: DOCUMENT_TOO_LARGE_FOR_CAS, message: File exceeds the 10MB limit CAS enforces }
                invalid_signature_fields:
                  summary: Bad signatureFields
                  value: { error: INVALID_SIGNATURE_FIELDS, message: 'widthRatio must be between 0.16 and 0.6, got 0.9' }
                invalid_signer_config:
                  summary: Bad signer details
                  value: { error: INVALID_SIGNER_CONFIG, message: identificationNumber must be 9 or 12 digits }
                enterprise_missing_tax_code:
                  summary: Enterprise signer without a tax code
                  value: { error: INVALID_SIGNER_CONFIG, message: taxCode is required for enterprise signers }
                invalid_language:
                  summary: Bad language
                  value: { error: INVALID_LANGUAGE, message: 'language must be "vi" or "en"' }
                no_file:
                  summary: Missing file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes:
            - INVALID_MULTIPART
            - NO_FILE_UPLOADED
            - INVALID_PDF
            - DOCUMENT_TOO_LARGE_FOR_CAS
            - INVALID_SIGNATURE_FIELDS
            - INVALID_SIGNER_CONFIG
            - INVALID_LANGUAGE
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS returned an error or didn't respond in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                submit_failed:
                  summary: CAS error
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: Không thể gửi yêu cầu ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400, casRequestId: "-CwlQfsQfdim_y2q" }
                timeout:
                  summary: CAS timed out
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: CAS không phản hồi kịp thời. Vui lòng thử lại sau.
                    detail: { timeout: true }
                certificate_not_found:
                  summary: CAS found no digital certificate
                  value:
                    error: CAS_CERTIFICATE_NOT_FOUND
                    message: Không tìm thấy thông tin người dùng bên CAS.
                    detail: { casErrorCode: E_SIGN_CERTIFICATE_NOT_FOUND }
          x-error-codes: [CAS_SUBMIT_FAILED, CAS_CERTIFICATE_NOT_FOUND]

  /api/sign/status:
    get:
      tags: [Signing]
      operationId: getSignStatus
      summary: Look up a signing request's status
      description: |
        A pass-through proxy to CAS's `request-status`, no caching.

        Recommended polling: every 4 seconds; on `429` wait per `Retry-After` (or 8 seconds); on other errors wait 6 seconds;
        stop once `status` is `SIGNED`, `REJECTED`, `FAILED` or `EXPIRED`.

        | `rawState` (CAS) | `status` | Action |
        |---|---|---|
        | `NEW` | `PENDING` | Keep polling |
        | `ACCEPTED` | `ACCEPTED` | Keep polling |
        | `COMPLETED` | `SIGNED` | Stop, download with `identityKey` |
        | `REJECTED` | `REJECTED` | Stop |
        | `FAILED`, `CANCELLED`, `CANCELED` (defensive) | `FAILED` | Stop |
        | `EXPIRED` (defensive) | `EXPIRED` | Stop |
        | anything else | `PENDING` | Keep polling |

        Source: `app/api/sign/status/route.ts`, `lib/mapCasState.ts`.
      parameters:
        - name: signRequestId
          in: query
          required: true
          description: 'The `signRequestId` from `POST /api/sign/request`. Only checked for presence, not format.'
          schema:
            type: string
          example: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignStatusResponse'
              examples:
                pending:
                  summary: Waiting for the signer
                  value: { status: PENDING, rawState: NEW, signedAt: null, identityKeyExpiresAt: null }
                signed:
                  summary: Signed
                  value:
                    status: SIGNED
                    rawState: COMPLETED
                    signedAt: '2026-09-29T03:15:42.000Z'
                    identityKey: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
                    identityKeyExpiresAt: '2026-09-30T03:15:42.000Z'
                    orgIdSigned: kysoqr.com#3bLzsA
                rejected:
                  summary: Signer declined
                  value: { status: REJECTED, rawState: REJECTED, signedAt: null, identityKeyExpiresAt: null }
        '400':
          description: Missing `signRequestId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Missing signRequestId
                  value: { error: MISSING_SIGN_REQUEST_ID, message: signRequestId query param is required }
          x-error-codes: [MISSING_SIGN_REQUEST_ID]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS returned an error or didn't respond in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                status_failed:
                  summary: CAS error
                  value:
                    error: CAS_STATUS_FAILED
                    message: Không thể kiểm tra trạng thái ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS timed out
                  value: { error: CAS_STATUS_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_STATUS_FAILED]

  /api/sign/download:
    get:
      tags: [Signing]
      operationId: downloadSignedPdf
      summary: Download the signed PDF
      description: |
        Downloads the signed PDF from CAS. The server streams it straight back and keeps no copy.

        Each `identityKey` can only be used a limited number of times on the CAS side (observed: 5; CAS hasn't published an
        official number and doesn't report how many uses remain), and it expires at `identityKeyExpiresAt`. Save the file after downloading.

        Source: `app/api/sign/download/route.ts`, `lib/cas/casPayload.ts`.
      parameters:
        - name: identityKey
          in: query
          required: true
          description: 'The `identityKey` from `GET /api/sign/status` once `status = SIGNED`. **Not** the `signRequestId`.'
          schema:
            type: string
          example: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
      responses:
        '200':
          description: The signed PDF as binary.
          headers:
            Content-Disposition:
              description: Always `attachment; filename="signed.pdf"`.
              schema:
                type: string
                example: attachment; filename="signed.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Missing `identityKey`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Missing identityKey
                  value: { error: MISSING_IDENTITY_KEY, message: identityKey query param is required }
          x-error-codes: [MISSING_IDENTITY_KEY]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: '`identityKey` wrong/expired/used up, CAS returned something that is not a PDF, or CAS timed out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                download_failed:
                  summary: CAS error
                  value:
                    error: CAS_DOWNLOAD_FAILED
                    message: Không thể tải file đã ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS timed out
                  value: { error: CAS_DOWNLOAD_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_DOWNLOAD_FAILED]

  /api/verify/upload:
    post:
      tags: [Verification]
      operationId: verifyPdfUpload
      summary: Verify the signatures in a PDF
      description: |
        Cryptographically verifies every digital signature in a PDF: the CMS signature, content integrity, the certificate chain up
        to a trusted root CA (fetching intermediates via AIA) and revocation status (OCSP/CRL). **Independent of CAS**, needs no env vars,
        and verifies PDFs signed by any system.

        - A file with no signatures → `{ "signatures": [] }`.
        - **Every signature** in the file is verified, with no limit on how many (the server verifies at most 4 at a time).
        - Optional fields are **absent** (not `null`) when they don't apply.

        ### Supported signatures

        | | Supported | Not supported yet |
        |---|---|---|
        | Signing device | USB token, HSM / remote signing (e.g. Cas ID), SIM PKI — all verified the same way | — |
        | Format (SubFilter) | `adbe.pkcs7.detached`, `ETSI.CAdES.detached` | Anything else, e.g. `ETSI.RFC3161` (document timestamp) → `UNSUPPORTED_SUBFILTER` for that entry only |
        | Key / digest | RSA with SHA-256/384/512 (SHA-1 only for signatures without signed attributes) | ECDSA and other keys → `UNSUPPORTED_ALGORITHM` |
        | Trusted CAs | Chains to a bundled Vietnam National Root CA (MIC; NEAC: USB token, remote signing, Mobile PKI); intermediates fetched via AIA | Other roots → `ROOT_NOT_TRUSTED` |
        | Timestamps / LTV | — | Not validated |

        Source: `app/api/verify/upload/route.ts`, `lib/verification/verifyPdfSignatures.ts`, `lib/verification/certChainVerifier.ts`, `lib/verification/revocationChecker.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The PDF to verify, max **20 MiB** (20971520 bytes).
                    Must satisfy all 3: name ends in `.pdf`, content type `application/pdf`, first 5 bytes are `%PDF-`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Verification results, one item per signature in document order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUploadResponse'
              examples:
                valid:
                  summary: Valid signature
                  value:
                    signatures:
                      - status: SIGNED_VALID
                        message: The signature, content, and certificate chain are all valid.
                        signedAt: '2026-09-29T03:15:40.000Z'
                        certificate:
                          subject: CN=NGUYEN VAN A, C=VN
                          issuer: CN=CA Example, O=Example CA, C=VN
                          serialNumber: 5a1f0c
                          validFrom: '2026-01-01T00:00:00.000Z'
                          validTo: '2027-01-01T00:00:00.000Z'
                        certificateChain:
                          - index: 0
                            subject: CN=NGUYEN VAN A, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: 5a1f0c
                            validFrom: '2026-01-01T00:00:00.000Z'
                            validTo: '2027-01-01T00:00:00.000Z'
                            isCa: false
                            ocsp: { status: not_revoked, url: 'http://ocsp.example.vn' }
                            crl: { status: unavailable, url: null }
                          - index: 1
                            subject: CN=CA Example, O=Example CA, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: '01'
                            validFrom: '2020-01-01T00:00:00.000Z'
                            validTo: '2040-01-01T00:00:00.000Z'
                            isCa: true
                            ocsp: null
                            crl: null
                        certificateExpiredNow: false
                        contentIntact: true
                        position: 1
                unsigned:
                  summary: No signatures in the file
                  value: { signatures: [] }
                modified:
                  summary: Content modified after signing
                  value:
                    signatures:
                      - status: CONTENT_DIGEST_MISMATCH
                        message: The PDF content does not match what was actually signed.
                        contentIntact: false
                        position: 1
        '400':
          description: Invalid file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                too_large:
                  summary: File over 20 MiB (checked before INVALID_PDF)
                  value: { error: FILE_TOO_LARGE, message: File exceeds the 20MB limit }
                invalid_pdf:
                  summary: Not a PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                no_file:
                  summary: Missing file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes: [INVALID_MULTIPART, NO_FILE_UPLOADED, FILE_TOO_LARGE, INVALID_PDF]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Unexpected failure while processing the whole file. The server fails instead of returning an empty list,
            so this can't be mistaken for "the file has no signatures". This route never returns `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                failed:
                  summary: Verification failed
                  value: { error: VERIFICATION_FAILED, message: Failed to verify the uploaded PDF }
          x-error-codes: [VERIFICATION_FAILED]

  /api/verify/signing-round/{orgIdSigned}:
    get:
      tags: [Verification]
      operationId: getSigningRound
      summary: Look up a signing round by code
      description: |
        Looks up CAS's record of a signing round by its `orgIdSigned` code. This is a **lookup of data CAS stored**, not
        cryptographic verification; to verify the signatures in a file, use `POST /api/verify/upload`.

        The fields inside `signingRound` come from CAS and are passed through as-is.

        Source: `app/api/verify/signing-round/[orgIdSigned]/route.ts`, `lib/cas/CasProvider.ts` (`SigningRoundDetail`).
      parameters:
        - name: orgIdSigned
          in: path
          required: true
          description: |
            The signing-round code, from `orgIdSigned` in `GET /api/sign/status` (also printed on the signed PDF).
            May contain a prefix such as `kysoqr.com#`. **Must be URL-encoded** (`#` → `%23`), otherwise everything after `#` is dropped.
          schema:
            type: string
          example: kysoqr.com#3bLzsA
      responses:
        '200':
          description: '`signingRound` is `null` when not found (still HTTP 200, not an error).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRoundResponse'
              examples:
                found:
                  summary: Found (illustrative values; real content comes from CAS)
                  value:
                    signingRound:
                      device: {}
                      signer: { displayName: NGUYEN VAN A }
                      authMethod: Cas ID
                      signedAt: '2026-09-29T03:15:42.000Z'
                      certificate:
                        issuer: { commonName: CA Example, organization: Example CA, country: VN }
                        signer: { commonName: NGUYEN VAN A, country: VN, taxOrCitizenId: 'CCCD:001099012345' }
                        documentIntegrity: Not modified
                        validFrom: '2026-01-01T00:00:00.000Z'
                        validTo: '2027-01-01T00:00:00.000Z'
                        signatureValidity: Valid at signing time
                        hasTimestamp: 'Yes'
                        signedAtLong: 10:15:42 29/09/2026
                not_found:
                  summary: Not found
                  value: { signingRound: null }
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS returned an error or didn't respond in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                lookup_failed:
                  summary: CAS error
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: Không thể tra cứu phiên ký. Vui lòng thử lại sau., detail: { casStatus: 500 } }
                timeout:
                  summary: CAS timed out
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_SIGNING_ROUND_FAILED]

  /api/vneid/sign:
    post:
      tags: [VNeID signing]
      operationId: startVneidSigning
      summary: Start a VNeID signing request
      description: |
        Checks and prepares the PDF, then sends a signing request to the CSign Gateway (CMC). The signer gets a
        "Confirm the digital signing request" notification in the **VNeID** app and has **5 minutes** to confirm; a transaction lives at most **30 minutes**.

        - The client sends only the PDF, the CCCD number, the signature boxes and the language. Every identifier sent to CSign (`requestId`, `documentId`, digest) is generated by the server.
        - The CCCD's certificate is checked (right CCCD, RSA key, valid now, trusted CA chain) **before** any notification is sent.
        - One open request per CCCD (`409 VNEID_REQUEST_PENDING`).
        - Keep `transactionId` and `clientSecret` for `/api/vneid/status` and `/api/vneid/finalize`; `clientSecret` is returned only once.
        - Requires an `Origin` header of the KysoQR site and `Content-Length` (up to 10.5 MB). When the server enables Turnstile: an `x-turnstile-token` header (action `vneid_sign`).
        - Rate limit: 30 requests / 10 minutes / IP.

        Source: `app/api/vneid/sign/route.ts`, `lib/vneid/service.ts`, `lib/vneid/certPolicy.ts`, `lib/pdfSign/`.
      parameters:
        - name: x-turnstile-token
          in: header
          required: false
          description: Cloudflare Turnstile token. Required only when the server sets `TURNSTILE_SECRET`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, citizenPid, signatureFields]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF (`.pdf`, `application/pdf`, up to 10 MB, no password, not locked against changes).
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  description: The signer's 12-digit CCCD number. Never stored, logged or returned.
                  example: '001099012345'
                signatureFields:
                  type: string
                  description: 'JSON array (up to 4096 characters) of 1–10 `SignatureFieldInput`. Example: `[{"page":1,"xRatio":0.55,"yRatio":0.78,"widthRatio":0.34,"heightRatio":0.1}]`'
                language:
                  type: string
                  enum: [vi, en]
                  default: vi
                  description: Language of the text in the signature box and of error messages.
                credentialId:
                  type: string
                  pattern: '^[0-9A-Fa-f]{1,64}$'
                  description: |
                    (Optional) `credentialId` of the certificate the user picked from `POST /api/vneid/credentials`.
                    The server fetches `credentials/list` again and re-checks that certificate; missing or unusable → `422`.
                    Left out, the server picks the usable certificate valid longest.
      responses:
        '200':
          description: The request was sent to VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidSignResponse'
        '400':
          description: Invalid CCCD number, file or signature boxes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { error: VNEID_INVALID_INPUT, message: 'Invalid input.' }
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: |
            `VNEID_FORBIDDEN_ORIGIN`: no `Origin`, or not the KysoQR site.
            `VNEID_CHALLENGE_FAILED`: Turnstile token missing or refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CHALLENGE_FAILED]
        '409':
          description: This CCCD already has a request waiting (at KysoQR, or at CSign with code `-01`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_REQUEST_PENDING]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: |
            `VNEID_PDF_REJECTED`: this file cannot be signed (password, locked, damaged, unsupported structure).
            `VNEID_NO_CERTIFICATE`: the CCCD has no certificate (CSign `04`, `4029`, `4031`).
            `VNEID_CERT_INVALID`: the certificate is not activated, expired, for another CCCD or has an unsupported key.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_PDF_REJECTED, VNEID_NO_CERTIFICATE, VNEID_CERT_INVALID]
        '429':
          description: |
            `RATE_LIMITED`: per-IP rate limit exceeded.
            `VNEID_CITIZEN_LIMITED`: 10 or more refused/ignored requests for this CCCD in 24 hours; paused for 1 hour.
            Both carry `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED, VNEID_CITIZEN_LIMITED]
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign returned an error, did not answer in time or answered something unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: |
            `VNEID_NOT_CONFIGURED`: the server is not set up for VNeID signing.
            `VNEID_DAILY_CAP`: the daily quota of requests is used up (with `Retry-After`).
            `VNEID_BUSY`: too many files in progress; retry in a few seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED, VNEID_DAILY_CAP, VNEID_BUSY]

  /api/vneid/credentials:
    post:
      tags: [VNeID signing]
      operationId: listVneidCredentials
      summary: List the certificates of a CCCD
      description: |
        Calls CSign `credentials/list` for the CCCD and checks each certificate (right CCCD, RSA key, valid now,
        CA chain signed link by link), so the user can pick one before signing. **Nothing is sent to anyone's phone.**

        - Never returns the holder's name or the CCCD: anyone can type any number, so the answer must not become a name lookup.
        - Order: usable certificates first, then by the latest expiry.
        - A CA chain from CSign that does not link up does **not** rule a certificate out (CSign lists it as active); it is only marked `chainVerified: false`.
        - Requires an `Origin` header of the KysoQR site and `Content-Length` (up to 1 KB).
        - Rate limit: 20 requests / 10 minutes / IP and 10 / 10 minutes / CCCD.

        Source: `app/api/vneid/credentials/route.ts`, `lib/vneid/service.ts` (`listCredentialsForCitizen`), `lib/vneid/certPolicy.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenPid]
              properties:
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  example: '001099012345'
      responses:
        '200':
          description: The certificates.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/VneidCredential'
        '400':
          description: The body is not JSON or the CCCD number is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: No `Origin`, or not the KysoQR site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: The CCCD has no certificate at CSign (or the number is wrong).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NO_CERTIFICATE]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign returned an error, did not answer in time or answered something unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: The server is not set up for VNeID signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/providers:
    get:
      tags: [VNeID signing]
      operationId: listVneidProviders
      summary: Certificate providers and their packs
      description: |
        Calls CSign `provider/list`: the providers (CAs) and the certificate packs of each, **paid ones included** (with their price),
        for a citizen without a certificate to choose from when registering one. No personal data in or out.

        - Not filtered by provider status: the CSign spec contradicts itself about `status`. A disabled provider is refused by CSign at registration (`VNEID_PROVIDER_UNAVAILABLE`).
        - The server asks CSign at most every 10 minutes.
        - Rate limit: 30 requests / 10 minutes / IP.

        In the code: `app/api/vneid/providers/route.ts`, `lib/vneid/registration.ts` (`listProviders`).
      responses:
        '200':
          description: Providers and packs.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VneidProvider'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign failed, did not answer in time, or answered something unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: The server is not set up for VNeID signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/registrations:
    post:
      tags: [VNeID signing]
      operationId: registerVneidCertificate
      summary: Register a new certificate for a citizen without one
      description: |
        Sends CSign `credentials/register` for the CCCD, with a provider and pack picked from `/api/vneid/providers`.
        CSign then asks the citizen, in the VNeID app, to **share their details**; the citizen agrees, the CA issues the certificate,
        and the citizen **activates** it in the app. Follow it with `/api/vneid/registrations/status`.

        - The form (`userInfo`) goes to CSign only: it is not stored, not logged, not sent back. The server keeps the provider, pack, status and CSign's codes under an HMAC of the CCCD until the outcome is known (then 24 more hours).
        - Dates are sent as `YYYY-MM-DD`; the server turns them into `dd/MM/yyyy` for CSign.
        - One open request per CCCD, at most 3 requests / 24 hours.
        - Requires the `Origin` header, `Content-Length` (at most 8 KB) and `x-turnstile-token` when the server has Turnstile on.
        - Rate limit: 5 requests / 10 minutes / IP.

        In the code: `app/api/vneid/registrations/route.ts`, `lib/vneid/registration.ts` (`startRegistration`), `lib/vneid/registrationForm.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidRegistrationRequest'
      responses:
        '201':
          description: CSign took the request; the citizen continues on VNeID.
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    $ref: '#/components/schemas/VneidRegistration'
        '400':
          description: |
            `VNEID_INVALID_INPUT`: the body is not JSON or the CCCD number is invalid.
            `VNEID_REGISTRATION_INVALID`: the form is incomplete or wrong (name, dates, phone, email...), or CSign refused the details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT, VNEID_REGISTRATION_INVALID]
        '403':
          description: Missing `Origin`, not the KysoQR site, or Turnstile failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CHALLENGE_FAILED]
        '409':
          description: |
            `VNEID_REGISTRATION_PENDING`: the CCCD has a registration (or another request) waiting on VNeID.
            `VNEID_ALREADY_REGISTERED`: the CCCD already has this provider's free certificate (CSign `19` / `30`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_REGISTRATION_PENDING, VNEID_ALREADY_REGISTERED]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: The provider or pack is not in CSign's list, or is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_PROVIDER_UNAVAILABLE]
        '429':
          description: |
            `RATE_LIMITED`: the per-IP rate limit is exceeded.
            `VNEID_REGISTRATION_LIMITED`: the CCCD sent 3 registrations in 24 hours.
            Both come with a `Retry-After` header.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED, VNEID_REGISTRATION_LIMITED]
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign failed, did not answer in time, or answered something unreadable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: The server is not set up for VNeID signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/registrations/status:
    post:
      tags: [VNeID signing]
      operationId: getVneidRegistration
      summary: Certificate registration status of a CCCD
      description: |
        The CCCD's certificate registration: open, or finished in the last 24 hours; `null` when there is none.
        Looked up by CCCD, so after a page reload typing the CCCD again finds the request. The page calls this every few seconds while waiting.

        - The server asks CSign `credentials/get-status` at most every 5 seconds for the first 30 minutes, then every minute.
        - No name or other personal data in the answer.
        - Requires the KysoQR `Origin` header and `Content-Length` (at most 1 KB).
        - Rate limit: 60 requests / minute / IP and 30 / minute / CCCD.

        In the code: `app/api/vneid/registrations/status/route.ts`, `lib/vneid/registration.ts` (`getRegistration`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenPid]
              properties:
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  example: '001099012345'
      responses:
        '200':
          description: The latest registration, or `null`.
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    oneOf:
                      - $ref: '#/components/schemas/VneidRegistration'
                      - type: 'null'
        '400':
          description: The body is not JSON or the CCCD number is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: Missing `Origin`, or not the KysoQR site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '503':
          description: The server is not set up for VNeID signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/status:
    post:
      tags: [VNeID signing]
      operationId: getVneidSigningStatus
      summary: Get the status of a VNeID signing request
      description: |
        Read from the server's database. The server asks CSign (`query-status`, at most once per 15 seconds per request)
        only while the signer can still confirm (5 minutes + 1 minute); after that only the webhook updates the result.

        Suggested polling: every 4 seconds for the first 5 minutes, then every 10 seconds; stop at `SIGNED`, `FINALIZED`,
        `REJECTED`, `EXPIRED`, `FAILED` or past `expiresAt`; on `429` wait for `Retry-After`.

        | `status` | Meaning |
        |---|---|
        | `PENDING` | Sent; CSign has not yet reported the notification reached the signer |
        | `WAITING_USER` | Waiting for the signer to confirm in VNeID |
        | `SIGNED` | The signature is in; call `/api/vneid/finalize` |
        | `FINALIZED` | The signed file was downloaded (can be downloaded again) |
        | `REJECTED` | The signer refused (`reason: REFUSED`) |
        | `EXPIRED` | Timed out (`reason: TIMEOUT`) |
        | `FAILED` | `reason`: `SIGNATURE_UNUSABLE` (the signature CSign returned is unusable), `CODE_ATTEMPTS`, `PROVIDER` |

        A wrong `transactionId` and a wrong `clientSecret` both give the same `404`. Rate limit: 120 requests / minute / IP and 30 / minute / transaction.

        Source: `app/api/vneid/status/route.ts`, `lib/vneid/service.ts`.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: '`Bearer <clientSecret>` from `/api/vneid/sign`.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidStatusRequest'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidStatusResponse'
        '400':
          description: The body is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: No `Origin`, or not the KysoQR site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN]
        '404':
          description: No such transaction, or a wrong `clientSecret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_FOUND]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '503':
          description: The server is not set up for VNeID signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/finalize:
    post:
      tags: [VNeID signing]
      operationId: finalizeVneidSigning
      summary: Embed the VNeID signature and download the signed PDF
      description: |
        Send back **exactly the original PDF** (raw `application/pdf` body); the server checks its length and SHA-256
        against the file that was sent for signing, embeds the signature as an incremental update (earlier signatures
        untouched), then checks the result: the new signature must verify and no earlier one may break. Otherwise no
        file is returned (`500 VNEID_SELF_CHECK_FAILED`).

        **Signature in the file:** the same standard as a Cas ID signature: `/Reason`, `/Location`, `/ContactInfo`,
        `/Prop_Build` as CAS writes them, a field named `Signature<n>`. The box shows a check mark, the signer's name,
        `Ngày: dd/MM/yyyy HH:mm:ss` (`Date:` in English) and `+07:00`. The time in the box (and `/M`) is when the request
        was sent: the box is drawn before the signer confirms.

        **Signing time:** on the first call the server gets an RFC 3161 timestamp from a TSA (`TSA_URL`, DigiCert by
        default; on failure `TSA_FALLBACK_URL`, Sectigo by default) for the signature it received and adds it to the CMS
        (unsigned attribute `signatureTimeStampToken`, PAdES B-T): Adobe Reader shows that time as the signing time, a
        few seconds after the confirmation. Later calls reuse the same timestamp. If both TSAs fail the file is still
        returned, without a timestamp.

        Up to 5 calls per transaction (to retry a lost download). Rate limit: 30 requests / minute / IP.

        Source: `app/api/vneid/finalize/route.ts`, `lib/vneid/service.ts`, `lib/pdfSign/finalize.ts`.
      parameters:
        - name: x-vneid-tx
          in: header
          required: true
          description: '`transactionId` from `/api/vneid/sign`.'
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          description: '`Bearer <clientSecret>`.'
          schema:
            type: string
        - name: x-vneid-code
          in: header
          required: false
          description: The 6-character code shown in the document name on VNeID. Needed only when `codeRequired` is `true`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'The signed PDF (`Content-Disposition: attachment`).'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: |
            `VNEID_FORBIDDEN_ORIGIN`: no `Origin`, or not the KysoQR site.
            `VNEID_CODE_INVALID`: wrong confirmation code; 5 wrong codes cancel the transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CODE_INVALID]
        '404':
          description: No such transaction, or a wrong `clientSecret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_FOUND]
        '409':
          description: |
            `VNEID_NOT_READY`: the signer has not confirmed yet.
            `VNEID_DOCUMENT_MISMATCH`: this is not the file that was sent for signing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_READY, VNEID_DOCUMENT_MISMATCH]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          description: |
            `RATE_LIMITED`: per-IP rate limit exceeded (with `Retry-After`).
            `VNEID_FINALIZE_LIMIT`: more than 5 calls for this transaction.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED, VNEID_FINALIZE_LIMIT]
        '500':
          description: |
            `VNEID_SELF_CHECK_FAILED`: the signed file failed the final check and was not released.
            `VNEID_INTERNAL`: any other server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_SELF_CHECK_FAILED, VNEID_INTERNAL]
        '503':
          description: |
            `VNEID_NOT_CONFIGURED`: the server is not set up for VNeID signing.
            `VNEID_BUSY`: too many files in progress; retry in a few seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED, VNEID_BUSY]

  /api/vneid/webhook:
    post:
      tags: [VNeID signing]
      operationId: receiveCsignWebhook
      summary: Receive CSign Gateway webhooks
      description: |
        Called by **CSign** (machine to machine), not by browsers. Register this URL at CSign
        (`POST /api/organization/webhooks`) with the events `signing.created`, `signing.completed`, `signing.failed`.

        - Authenticated by HMAC-SHA256 over the **raw body**, keyed with the secret string (`CSIGN_WEBHOOK_SECRET`), in
          `abp-webhook-signature: HMAC SHA256=<hex>`. A wrong signature → `401`.
        - `organizationId` must be KysoQR's; a `timestamp` more than 30 minutes off → `400`. Each event `id` is processed once.
        - A signature in `signing.completed` is stored only once it verifies mathematically; `signing.failed` is confirmed with `query-status`.
        - Answers follow the CSign docs: `200 { received: true }` (also for events deliberately ignored); errors `{ error, errorDescription }`.
          Only `500` makes CSign retry.
        - Body up to 64 KB. Rate limit: 300 requests / minute / IP.

        Source: `app/api/vneid/webhook/route.ts`, `lib/vneid/webhook.ts`.
      parameters:
        - name: abp-webhook-signature
          in: header
          required: true
          description: '`HMAC SHA256=<hex>` of the raw body.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidWebhookEvent'
      responses:
        '200':
          description: Received (processed, or deliberately ignored).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    const: true
        '400':
          description: '`invalid_payload`, `organization_mismatch`, `stale_event`, `payload_too_large`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '401':
          description: '`invalid_signature`: the HMAC signature is wrong.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: '`internal_error`: not processed; CSign will redeliver.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '503':
          description: '`not_configured`: VNeID signing or the webhook is not configured on the server.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'

components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying. Only present with `RATE_LIMITED`.
      schema:
        type: integer
        minimum: 1
      example: 3

  responses:
    TooManyRequests:
      description: KysoQR's rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR limit
              value: { error: RATE_LIMITED, message: Too many requests }
      x-error-codes: [RATE_LIMITED]
    TooManyRequestsCas:
      description: |
        `RATE_LIMITED`: KysoQR's rate limit exceeded (has a `Retry-After` header).
        `CAS_RATE_LIMITED`: CAS is limiting KysoQR's account (no `Retry-After`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR limit
              value: { error: RATE_LIMITED, message: Too many requests }
            cas_rate_limited:
              summary: CAS limit
              value: { error: CAS_RATE_LIMITED, message: CAS is rate-limiting this client }
      x-error-codes: [RATE_LIMITED, CAS_RATE_LIMITED]
    CasNotConfigured:
      description: The server is missing CAS env vars (`CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID`, `CAS_ESIGN_API_KEY`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            not_configured:
              summary: CAS not configured
              value: { error: CAS_NOT_CONFIGURED, message: Máy chủ chưa được cấu hình đầy đủ để ký số. Vui lòng liên hệ quản trị viên. }
      x-error-codes: [CAS_NOT_CONFIGURED]
    VneidLengthRequired:
      description: No `Content-Length` header (VNeID routes do not read bodies of undeclared length).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_LENGTH_REQUIRED]
    VneidPayloadTooLarge:
      description: The body is larger than the route accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_PAYLOAD_TOO_LARGE]
    VneidUnsupportedMediaType:
      description: Wrong `Content-Type`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_UNSUPPORTED_MEDIA_TYPE]
    VneidInternal:
      description: Unexpected server error (details only in the server log).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_INTERNAL]

  schemas:
    ApiError:
      type: object
      description: Shared body of every JSON error.
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable error code; branch on this in code. Each route's list of codes is in its response section.
          example: INVALID_PDF
        message:
          type: string
          description: Human-readable (Vietnamese or English depending on the error). Do not branch on it.
        detail:
          $ref: '#/components/schemas/CasErrorDetail'

    CasErrorDetail:
      description: Only on 502 errors from routes that call CAS. Absent when the error didn't come from CAS and wasn't a timeout.
      oneOf:
        - title: CAS returned an HTTP error
          type: object
          properties:
            casErrorCode:
              type: string
              description: CAS's error code, e.g. `E_SIGN_CERTIFICATE_NOT_FOUND`.
            casStatus:
              type: integer
              description: HTTP status returned by CAS.
            casErrorType:
              type: string
              description: CAS's error type.
            casRequestId:
              type: string
              description: CAS's `requestId`, useful when raising an issue with CAS.
        - title: CAS timed out
          type: object
          required: [timeout]
          properties:
            timeout:
              type: boolean
              const: true

    SignatureFieldInput:
      type: object
      description: One signature box. Coordinates are 0–1 fractions of the page, origin at the top-left (DOM convention). The server converts to CAS's convention.
      required: [page, xRatio, yRatio, widthRatio, heightRatio]
      properties:
        page:
          type: integer
          minimum: 1
          description: Page number, 1-based.
        xRatio:
          type: number
          description: Left edge, from the page's left edge. Finite; clamped to 0–1.
        yRatio:
          type: number
          description: '**Top** edge, from the page''s **top** edge. Finite; clamped to 0–1.'
        widthRatio:
          type: number
          minimum: 0.16
          maximum: 0.6
          description: Box width.
        heightRatio:
          type: number
          minimum: 0.055
          maximum: 0.22
          description: Box height.

    SignRequestResponse:
      type: object
      required: [signRequestId, qrContent, state]
      properties:
        signRequestId:
          type: string
          format: uuid
          description: Signing request ID, used with `GET /api/sign/status`.
        qrContent:
          type: string
          description: Content to render as a QR code, like `https://scan2grant.bankhub.vn?signToken=…`.
        state:
          type: string
          description: CAS's raw state right after creation, normally `NEW`.

    SignStatusResponse:
      type: object
      required: [status, rawState, signedAt, identityKeyExpiresAt]
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, SIGNED, REJECTED, FAILED, EXPIRED]
          description: Normalised status; branch on this field.
        rawState:
          type: string
          description: 'CAS''s raw state: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`.'
        signedAt:
          type: [string, 'null']
          format: date-time
          description: When signing finished; `null` until signed.
        identityKey:
          type: string
          description: Key for `GET /api/sign/download`. Only present when `status = SIGNED`; absent otherwise.
        identityKeyExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Expiry of `identityKey`. Set when `status = SIGNED`, otherwise `null`.
        orgIdSigned:
          type: string
          description: Signing-round code for `GET /api/verify/signing-round/{orgIdSigned}`, e.g. `kysoqr.com#3bLzsA`. Not officially documented by CAS; may be absent.
        expiresIn:
          type: number
          description: Time left on the signing request (seconds). Not officially documented by CAS; may be absent.

    VerifyUploadResponse:
      type: object
      required: [signatures]
      properties:
        signatures:
          type: array
          description: One item per signature, in document order (oldest first).
          items:
            $ref: '#/components/schemas/VerificationResult'

    VerificationResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [SIGNED_VALID, ROOT_NOT_TRUSTED, CONTENT_DIGEST_MISMATCH, SIGNATURE_INVALID, CHAIN_VALIDATION_FAILED, TRUST_STORE_NOT_CONFIGURED, UNSUPPORTED_SUBFILTER, UNSUPPORTED_ALGORITHM]
          description: |
            - `SIGNED_VALID`: signature, content and certificate chain are all valid.
            - `ROOT_NOT_TRUSTED`: signature and content are cryptographically valid, but the root CA isn't in the server's trust store.
            - `CONTENT_DIGEST_MISMATCH`: the content was modified after signing (or data was appended after the last signature).
            - `SIGNATURE_INVALID`: the signature doesn't match the certificate, the signature structure is broken, or an unexpected error occurred verifying this signature.
            - `CHAIN_VALIDATION_FAILED`: no certificate chain, or the chain is invalid.
            - `TRUST_STORE_NOT_CONFIGURED`: the server has no root CAs in its trust store.
            - `UNSUPPORTED_SUBFILTER`: this entry uses an unsupported format (e.g. an `ETSI.RFC3161` document timestamp). Only that entry is reported; the other signatures in the file are still verified. Has only `status`, `message` and possibly `signedAt`.
            - `UNSUPPORTED_ALGORITHM`: the signer's key isn't RSA (e.g. ECDSA) and can't be verified yet; `message` names the algorithm.
        message:
          type: string
          description: Fixed English sentence for the `status`.
        signedAt:
          type: string
          format: date-time
          description: From the CMS `signingTime`; falls back to the PDF's `/M`.
        certificate:
          $ref: '#/components/schemas/VerificationCertificate'
        certificateChain:
          type: array
          description: Item 0 is the signer, the last item is the root; each item's issuer is the next item.
          items:
            $ref: '#/components/schemas/ChainCertInfo'
        certificateChainRootNotInTrustStore:
          type: boolean
          const: true
          description: Only present when `status = ROOT_NOT_TRUSTED`.
        certificateExpiredNow:
          type: boolean
          description: The certificate has expired as of now. Informational only, doesn't change `status`.
        contentIntact:
          type: boolean
          description: '`true`: content unchanged since signing. `false`: content was modified.'
        position:
          type: integer
          minimum: 1
          description: Position of this signature in the file (oldest = 1).

    VerificationCertificate:
      type: object
      required: [subject, issuer, serialNumber, validFrom, validTo]
      properties:
        subject:
          type: string
          description: Certificate subject (DN).
        issuer:
          type: string
          description: Issuer (DN).
        serialNumber:
          type: string
          description: Serial number.
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time

    ChainCertInfo:
      type: object
      required: [index, subject, issuer, serialNumber, validFrom, validTo, isCa, ocsp, crl]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in the chain, from 0.
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        isCa:
          type: boolean
          description: Whether this is a CA certificate.
        ocsp:
          description: OCSP result against the issuer. `null` on the last item (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'
        crl:
          description: CRL result against the issuer. `null` on the last item (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'

    RevocationCheckResult:
      type: object
      description: Informational only; never changes the signature's `status`.
      required: [status, url]
      properties:
        status:
          type: string
          enum: [not_revoked, revoked, unavailable]
          description: '`unavailable` = couldn''t check (no URL, network error, invalid response); it does not mean revoked.'
        url:
          type: [string, 'null']
          description: The OCSP/CRL URL on the certificate, present even when the check failed; `null` when the certificate has no such URL.

    SigningRoundResponse:
      type: object
      required: [signingRound]
      properties:
        signingRound:
          description: '`null` when the signing round is not found.'
          oneOf:
            - $ref: '#/components/schemas/SigningRoundDetail'
            - type: 'null'

    SigningRoundDetail:
      type: object
      required: [device, signer, authMethod, signedAt, certificate]
      properties:
        device:
          type: object
          additionalProperties: true
          description: Signing device info. CAS hasn't documented its structure; treat as arbitrary key–value pairs.
        signer:
          type: object
          required: [displayName]
          properties:
            displayName:
              type: string
              description: Signer's display name.
        authMethod:
          type: string
          description: Authentication method the signer used.
        signedAt:
          type: [string, 'null']
          description: Signing time.
        certificate:
          type: object
          required: [issuer, signer, documentIntegrity, validFrom, validTo, signatureValidity, hasTimestamp, signedAtLong]
          properties:
            issuer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            signer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            documentIntegrity:
              type: string
              description: 'CAS''s document-integrity assessment, e.g. `Không bị thay đổi` / `Not modified`.'
            validFrom:
              type: [string, 'null']
            validTo:
              type: [string, 'null']
            signatureValidity:
              type: string
              description: 'CAS''s signature-validity assessment, e.g. `Hợp lệ tại thời điểm ký` / `Valid at signing time`.'
            hasTimestamp:
              type: string
              description: 'Whether there is a timestamp, e.g. `Có` / `Yes`. **A string, not a boolean.**'
            signedAtLong:
              type: [string, 'null']
              description: Signing time in CAS's long format.

    SigningRoundCertParty:
      type: object
      required: [commonName, country]
      properties:
        commonName:
          type: [string, 'null']
        organization:
          type: [string, 'null']
          description: May be absent.
        country:
          type: [string, 'null']
        taxOrCitizenId:
          type: [string, 'null']
          description: 'Tax code or national ID; may carry a `CCCD:`/`MST:` prefix. May be absent.'

    VneidSignResponse:
      type: object
      required: [transactionId, clientSecret, confirmDeadline, expiresAt, codeRequired, documentName]
      properties:
        transactionId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: 256-bit secret (43 base64url characters). Returned only once; keep it in the browser (sessionStorage), never in a URL.
        confirmDeadline:
          type: string
          format: date-time
          description: Deadline for the signer to confirm in VNeID (5 minutes).
        expiresAt:
          type: string
          format: date-time
          description: End of the whole transaction (30 minutes).
        codeRequired:
          type: boolean
          description: '`true` when the 6-character code shown in VNeID must be typed back at finalize.'
        documentName:
          type: string
          description: The document name the signer sees in the VNeID notification (never the file name).
      example:
        transactionId: 3f0c1d8e-6b2a-4c4e-9f51-7d2a9b6c1e40
        clientSecret: q7rM2pV9wLxN4sT8kZ1bC6dF3gH5jK0aE2uY7iO9pQs
        confirmDeadline: '2026-11-04T03:20:00.000Z'
        expiresAt: '2026-11-04T03:45:00.000Z'
        codeRequired: false
        documentName: KysoQR - Ký tài liệu 1A2B3C4D

    VneidCredential:
      type: object
      description: One certificate of a CCCD. Never the holder's name.
      required: [credentialId, usable, rootTrusted, chainVerified]
      properties:
        credentialId:
          type: string
          description: Certificate serial (CSign `credentialID`); send it back as `credentialId` to `/api/vneid/sign`.
        issuer:
          type: [string, 'null']
          description: Common name of the issuing CA.
        validFrom:
          type: [string, 'null']
          format: date-time
        validTo:
          type: [string, 'null']
          format: date-time
        keyBits:
          type: [integer, 'null']
        usable:
          type: boolean
          description: Can sign (passes every server check).
        reason:
          type: string
          enum: [NOT_ACTIVE, EXPIRED, NOT_YET_VALID, UID_MISMATCH, KEY_UNSUPPORTED, KEY_USAGE, SERIAL_MISMATCH, CHAIN_BROKEN, MALFORMED]
          description: Why it cannot sign (only when `usable` is `false`).
        rootTrusted:
          type: boolean
          description: The chain ends at a national root KysoQR trusts. `false` on the UAT environment (test root); signing still works but `/verify` reports the root as not trusted.
        chainVerified:
          type: boolean
          description: |
            The CA certificates CSign sent really issued and signed this certificate. `false` when CSign sends the
            wrong CA (e.g. on UAT: a certificate issued by `CMC-CA RS` sent with the production `CMC-CA`). The certificate
            can still sign (`usable`), the signature and the file stay valid, but `/verify` / Adobe cannot verify the CA chain.
        chainIssue:
          type: string
          enum: [issuer-not-ca, name-mismatch, signature-mismatch, ca-expired, ca-not-yet-valid]
          description: The first link that does not match (only when `chainVerified` is `false`).
      example:
        credentialId: 2E6879BD54CA1148E4D86D05A5288DC0
        issuer: CMC-CA RS
        validFrom: '2025-07-31T11:35:06.000Z'
        validTo: '2026-07-31T11:35:06.000Z'
        keyBits: 2048
        usable: true
        rootTrusted: true

    VneidProvider:
      type: object
      description: A certificate provider (CA) on CSign and its packs.
      required: [provider, name, packs]
      properties:
        provider:
          type: string
          description: Provider code; send it back as `provider` when registering.
          example: HUD-CMC-CA
        name:
          type: string
          example: CÔNG TY CỔ PHẦN TẬP ĐOÀN CÔNG NGHỆ CMC
        packs:
          type: array
          items:
            type: object
            required: [code, name, months, unitPrice, free]
            properties:
              code:
                type: string
                description: Pack code; send it back as `servicePackCode`.
                example: VNEID-FREE-12M
              name:
                type: string
              months:
                type: [integer, 'null']
                description: Certificate lifetime (months).
              unitPrice:
                type: [number, 'null']
                description: Price (VND). Paid packs are billed under the operator's contract with the provider; KysoQR takes no payment.
              free:
                type: boolean
                description: Free (`free = 1` or a price of 0).

    VneidRegistrationRequest:
      type: object
      required: [citizenPid, provider, servicePackCode, userInfo]
      properties:
        citizenPid:
          type: string
          pattern: '^[0-9]{12}$'
        provider:
          type: string
          example: HUD-CMC-CA
        servicePackCode:
          type: string
          example: VNEID-FREE-12M
        servicePackName:
          type: string
          description: |
            Optional. The chosen pack's name, to tell apart packs CSign lists under one code (e.g. VNPT `18130`).
            Used only when it matches a pack CSign lists for that code; CSign itself still gets `servicePackCode` only.
        userInfo:
          type: object
          description: |
            The registration form (CSign `userInfo` fields, without the CCCD). Required: `fullName`, `birthDate`, `gender`, `phone`, `email`.
            The others are optional: VNeID provides them once the citizen agrees to share their details.
          required: [fullName, birthDate, gender, phone, email]
          properties:
            fullName: { type: string, maxLength: 100 }
            birthDate: { type: string, format: date }
            gender: { type: string, enum: [Nam, Nữ] }
            phone: { type: string, example: '0912345678' }
            email: { type: string, format: email }
            nationalityCode: { type: string, pattern: '^[A-Z]{2}$', example: VN }
            issuingAuthority: { type: string, maxLength: 200 }
            dateOfIssue: { type: string, format: date }
            idCardExpireDate: { type: string, format: date }
            permanentAddress: { type: string, maxLength: 250 }
            permanentVillageText: { type: string, maxLength: 100 }
            permanentCityText: { type: string, maxLength: 100 }
            livingPlaceAddress: { type: string, maxLength: 250 }
            livingPlaceVillageText: { type: string, maxLength: 100 }
            livingPlaceCityText: { type: string, maxLength: 100 }

    VneidRegistration:
      type: object
      description: A certificate registration. No name or other personal data.
      required: [status, provider, providerName, servicePackCode, servicePackName, months, unitPrice, createdAt, expiresAt]
      properties:
        status:
          type: string
          enum: [PENDING, ISSUED, COMPLETED, FAILED, REJECTED, EXPIRED]
          description: |
            `PENDING`: waiting for the citizen to share their details on VNeID / the CA is issuing.
            `ISSUED`: the certificate is issued and waits for the citizen to activate it in the VNeID app.
            `COMPLETED`: done; the new certificate has `serialNumber` (= `credentialId`).
            `FAILED` / `REJECTED` / `EXPIRED`: ended without a certificate (see `reason`).
        reason:
          type: string
          enum: [REFUSED, TIMEOUT, CITIZEN_INFO, PROVIDER]
          description: |
            Only when it ended without a certificate. `REFUSED`: the citizen declined to share; `TIMEOUT`: it expired;
            `CITIZEN_INFO`: the citizen's details on VNeID are invalid or incomplete; `PROVIDER`: a CSign / CA failure.
        provider: { type: string }
        providerName: { type: string }
        servicePackCode: { type: string }
        servicePackName: { type: string }
        months: { type: [integer, 'null'] }
        unitPrice: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: The server stops following a still-open request after this time (24 hours).
        serialNumber:
          type: string
          description: Serial of the new certificate, its `credentialId` for signing (only when `COMPLETED`).

    VneidStatusRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          format: uuid

    VneidStatusResponse:
      type: object
      required: [status, confirmDeadline, expiresAt, codeRequired]
      properties:
        status:
          type: string
          enum: [PENDING, WAITING_USER, SIGNED, FINALIZED, REJECTED, EXPIRED, FAILED]
        reason:
          type: string
          enum: [REFUSED, TIMEOUT, SIGNATURE_UNUSABLE, CODE_ATTEMPTS, PROVIDER]
          description: Only when `status` is `REJECTED`, `EXPIRED` or `FAILED`.
        confirmDeadline:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        codeRequired:
          type: boolean
      example:
        status: WAITING_USER
        confirmDeadline: '2026-11-04T03:20:00.000Z'
        expiresAt: '2026-11-04T03:45:00.000Z'
        codeRequired: false

    VneidWebhookEvent:
      type: object
      description: An event CSign sends (CSign Gateway docs v1.11, section IV.4). Unknown fields are ignored.
      required: [id, eventName, timestamp, organizationId, data]
      properties:
        id:
          type: string
          description: Event id; each id is processed once.
        eventName:
          type: string
          example: signing.completed
        timestamp:
          type: string
          format: date-time
        organizationId:
          type: string
        data:
          type: object
          description: For `signing.*`.
          properties:
            transactionId:
              type: string
              description: CSign transaction id (returned by `sign-hash`).
            documentNumber:
              type: [string, 'null']
            providerTransactionId:
              type: [string, 'null']
              description: Must match the `rscaTransactionId` from `sign-hash`.
            providerInternalId:
              type: [string, 'null']
            status:
              type: integer
              description: 0 failed, 1 created, 2 processing, 3 waiting for VNeID confirmation, 4 done, 5 refused by the user.
            statusDescription:
              type: [string, 'null']
            signatures:
              type: [array, 'null']
              items:
                type: object
                properties:
                  documentId:
                    type: [string, 'null']
                  signature:
                    type: [string, 'null']
                    description: Base64 signature.
            errorCode:
              type: [string, 'null']
              example: errorcode4004

    VneidWebhookError:
      type: object
      description: Error format from the CSign webhook docs.
      required: [error, errorDescription]
      properties:
        error:
          type: string
        errorDescription:
          type: string
