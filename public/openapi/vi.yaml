openapi: 3.1.0
info:
  title: KysoQR API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API của KysoQR: ký số PDF qua mã QR (thông qua CAS e-sign) và xác minh chữ ký số trong file PDF.

    Tài liệu này viết cho cả lập trình viên lẫn AI agent. File spec là nguồn sự thật cho request/response;
    nếu lệch với code thì code đúng (mỗi endpoint ghi file nguồn tương ứng). Tải spec:
    [`/openapi/vi.yaml`](/openapi/vi.yaml) · [`/openapi/en.yaml`](/openapi/en.yaml) — import thẳng vào Postman được.

    ## Luồng ký từ đầu đến cuối

    1. `POST /api/sign/request` → nhận `signRequestId`, `qrContent`.
    2. Hiển thị `qrContent` thành mã QR; người ký quét bằng app **Cas ID** và duyệt.
    3. `GET /api/sign/status?signRequestId=…` — poll mỗi 4 giây (gặp `429` thì chờ theo `Retry-After`).
       `PENDING`/`ACCEPTED` → tiếp tục; `SIGNED` → có `identityKey`, `orgIdSigned`; `REJECTED`/`FAILED`/`EXPIRED` → dừng.
    4. `GET /api/sign/download?identityKey=…` → file PDF đã ký.
    5. (tuỳ chọn) `GET /api/verify/signing-round/{orgIdSigned}` → bản ghi phiên ký từ CAS.
    6. (tuỳ chọn) `POST /api/verify/upload` với file vừa tải → xác minh chữ ký bằng mật mã.

    ## Quy ước chung

    - **Xác thực:** không có. Mọi route đều public. Không có header CORS, nên trình duyệt chỉ gọi được từ cùng origin; server khác gọi trực tiếp bình thường.
    - **Body lỗi:** `{ error, message, detail? }` (schema `ApiError`). Phân nhánh theo `error`, không theo `message`.
      `detail` chỉ có ở lỗi `502` từ route gọi CAS; vắng mặt khi lỗi không đến từ CAS và không phải timeout.
    - **Rate limit theo IP** (sign/request 20, sign/status 60, sign/download 20, verify/upload 20, verify/signing-round 30 request / 60 giây).
      Vượt giới hạn → `429 RATE_LIMITED` kèm header `Retry-After`. IP lấy từ `CF-Connecting-IP`, không có thì phần tử cuối của `X-Forwarded-For`.
      Bộ đếm nằm trong bộ nhớ từng tiến trình server. Khác với `429 CAS_RATE_LIMITED` (CAS giới hạn tài khoản KysoQR, không có `Retry-After`).
    - **Thiếu cấu hình CAS:** 4 route gọi CAS trả `500 CAS_NOT_CONFIGURED` nếu server thiếu `CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID` hoặc `CAS_ESIGN_API_KEY`. `POST /api/verify/upload` không cần các biến này.

    ## Tích hợp CAS e-sign

    KysoQR không tự ký; việc ký (khoá bí mật, HSM) do CAS e-sign thực hiện. Tài liệu chính thức của CAS:
    [cas.so/general/api/product-esign](https://cas.so/general/api/product-esign).

    | Route KysoQR | API CAS | Timeout |
    |---|---|---|
    | `POST /api/sign/request` | `POST /esign/request-document` (multipart) | 30 giây |
    | `GET /api/sign/status` | `POST /esign/request-status` | 10 giây |
    | `GET /api/sign/download` | `POST /esign/download-file` | 30 giây |
    | `GET /api/verify/signing-round/{orgIdSigned}` | `GET /esign/signing-round/{orgIdSigned}` | 10 giây |

    - Header gửi CAS: `x-client-id` = `CAS_ESIGN_CLIENT_ID`, `x-secret-key` = `CAS_ESIGN_API_KEY`. Không retry tự động.
    - Trạng thái CAS chính thức: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`. `FAILED`/`CANCELLED`/`CANCELED`/`EXPIRED` chỉ được xử lý phòng hờ.
    - `identityKey`/`identityKeyExpiresAt` chỉ có giá trị khi `COMPLETED`. `orgIdSigned`, `expiresIn` chưa được CAS công bố chính thức.
    - Đảo trục Y: KysoQR dùng mép trên tính từ đỉnh trang; CAS dùng mép dưới tính từ đáy: `yRatio_CAS = 1 − yRatio − heightRatio` (`SignatureField.toCasConvention()`).
    - `documentName` = tên file bỏ `.pdf`, xoá ký tự điều khiển, tối đa 240 ký tự; ngắn hơn 10 thì thêm ` - KysoQR` (`lib/documentName.ts`).
    - Mã lỗi CAS xử lý riêng: HTTP 429 → `CAS_RATE_LIMITED`; `E_SIGN_PERSON_NOT_FOUND` → tự gửi lại dạng chỉ-QR;
      `E_SIGN_CERTIFICATE_NOT_FOUND` → `CAS_CERTIFICATE_NOT_FOUND`; `E_SIGN_SIGNING_ROUND_NOT_FOUND` → `200 { signingRound: null }`.
    - Kết nối ra ngoài của server: host trong `CAS_ESIGN_BASE_URL`, và các host AIA/OCSP/CRL ghi trên chứng thư (qua `lib/verification/guardedFetch.ts`, chặn IP nội bộ).

    Nguồn trong code: `lib/cas/CasEsignProvider.ts`, `lib/cas/casPayload.ts`, `lib/casErrorDetail.ts`, `lib/mapCasState.ts`, `lib/env.ts`.
  contact:
    name: KysoQR trên GitHub
    url: https://github.com/KysoQR/KysoQR

servers:
  - url: /
    description: Server đang mở trang này

tags:
  - name: Ký số
    description: Tạo yêu cầu ký, theo dõi trạng thái và tải file đã ký qua CAS e-sign.
  - name: Xác minh
    description: Xác minh chữ ký số trong PDF và tra cứu phiên ký.

paths:
  /api/sign/request:
    post:
      tags: [Ký số]
      operationId: createSignRequest
      summary: Tạo yêu cầu ký
      description: |
        Tạo một yêu cầu ký số trên CAS cho 1 file PDF, trả về nội dung QR để người ký quét bằng app **Cas ID**.
        `signRequestId` do KysoQR sinh (UUID v4). Server không lưu gì: file được gửi thẳng sang CAS trong cùng request.

        Nếu có `identificationNumber` mà CAS trả `E_SIGN_PERSON_NOT_FOUND` (số CCCD chưa đăng ký Cas ID),
        server tự gửi lại **một lần** chỉ dùng QR, giữ nguyên `signRequestId`; bên gọi vẫn nhận `200`.

        **Lưu ý:** gửi thử request này tạo yêu cầu ký thật trên CAS.

        Nguồn trong code: `app/api/sign/request/route.ts`, `lib/domain/SignatureField.ts`, `lib/domain/CasSignerConfig.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, signatureFields]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File PDF cần ký, tối đa **10 MiB** (10485760 byte, giới hạn của CAS).
                    Phải thoả cả 3: tên kết thúc `.pdf`, content type `application/pdf`, 5 byte đầu là `%PDF-`.
                signatureFields:
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/SignatureFieldInput'
                  description: |
                    Mảng JSON các ô chữ ký (xem schema `SignatureFieldInput`). Ít nhất 1 ô; không giới hạn số ô mỗi trang.
                    Toạ độ là tỉ lệ 0–1, gốc ở góc trên bên trái trang.
                  example: '[{"page":1,"xRatio":0.52,"yRatio":0.78,"widthRatio":0.34,"heightRatio":0.1}]'
                signerType:
                  type: string
                  enum: [individual, enterprise]
                  default: individual
                  description: Loại người ký. Giá trị khác → `400 INVALID_SIGNER_CONFIG`.
                identificationNumber:
                  type: string
                  pattern: '^\d{9}$|^\d{12}$'
                  description: |
                    Số CCCD (12 số) hoặc CMND (9 số). Có giá trị thì CAS gửi thêm thông báo đẩy tới app Cas ID của người đó.
                    Để trống thì chỉ dùng QR. Cố ý không có giá trị mẫu, để lệnh copy từ tài liệu không gửi nhầm thông báo tới người thật.
                taxCode:
                  type: string
                  pattern: '^\d{10}$|^\d{10}-\d{3}$'
                  description: Mã số thuế. **Bắt buộc khi `signerType=enterprise`** (thiếu → `400 INVALID_SIGNER_CONFIG`, message `taxCode is required for enterprise signers`); bỏ qua khi ký cá nhân. 10 số, hoặc 10 số + `-` + 3 số.
                organizationName:
                  type: string
                  description: Tên tổ chức, chỉ dùng khi `signerType=enterprise`. Gửi sang CAS nếu khác rỗng.
                representativeName:
                  type: string
                  description: Người đại diện, chỉ dùng khi `signerType=enterprise`. Được kiểm tra nhưng **không gửi sang CAS**.
                language:
                  type: string
                  enum: [vi, en]
                  default: vi
                  description: Ngôn ngữ hiển thị phía CAS. Giá trị khác → `400 INVALID_LANGUAGE`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Tạo yêu cầu ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
              examples:
                success:
                  summary: Thành công
                  value:
                    signRequestId: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
                    qrContent: https://scan2grant.bankhub.vn?signToken=eyJhbGciOi...
                    state: NEW
        '400':
          description: Request không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalid_pdf:
                  summary: File không phải PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                too_large:
                  summary: File lớn hơn 10 MiB
                  value: { error: DOCUMENT_TOO_LARGE_FOR_CAS, message: File exceeds the 10MB limit CAS enforces }
                invalid_signature_fields:
                  summary: signatureFields sai
                  value: { error: INVALID_SIGNATURE_FIELDS, message: 'widthRatio must be between 0.16 and 0.6, got 0.9' }
                invalid_signer_config:
                  summary: Thông tin người ký sai
                  value: { error: INVALID_SIGNER_CONFIG, message: identificationNumber must be 9 or 12 digits }
                enterprise_missing_tax_code:
                  summary: Ký doanh nghiệp thiếu MST
                  value: { error: INVALID_SIGNER_CONFIG, message: taxCode is required for enterprise signers }
                invalid_language:
                  summary: language sai
                  value: { error: INVALID_LANGUAGE, message: 'language must be "vi" or "en"' }
                no_file:
                  summary: Thiếu file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes:
            - INVALID_MULTIPART
            - NO_FILE_UPLOADED
            - INVALID_PDF
            - DOCUMENT_TOO_LARGE_FOR_CAS
            - INVALID_SIGNATURE_FIELDS
            - INVALID_SIGNER_CONFIG
            - INVALID_LANGUAGE
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                submit_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: Không thể gửi yêu cầu ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400, casRequestId: "-CwlQfsQfdim_y2q" }
                timeout:
                  summary: CAS không phản hồi kịp
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: CAS không phản hồi kịp thời. Vui lòng thử lại sau.
                    detail: { timeout: true }
                certificate_not_found:
                  summary: CAS không tìm thấy chứng thư số
                  value:
                    error: CAS_CERTIFICATE_NOT_FOUND
                    message: Không tìm thấy thông tin người dùng bên CAS.
                    detail: { casErrorCode: E_SIGN_CERTIFICATE_NOT_FOUND }
          x-error-codes: [CAS_SUBMIT_FAILED, CAS_CERTIFICATE_NOT_FOUND]

  /api/sign/status:
    get:
      tags: [Ký số]
      operationId: getSignStatus
      summary: Tra cứu trạng thái yêu cầu ký
      description: |
        Proxy gọi thẳng `request-status` của CAS, không cache.

        Poll khuyến nghị: mỗi 4 giây; gặp `429` thì chờ theo `Retry-After` (hoặc 8 giây); lỗi khác chờ 6 giây;
        dừng khi `status` là `SIGNED`, `REJECTED`, `FAILED` hoặc `EXPIRED`.

        | `rawState` (CAS) | `status` | Nên làm |
        |---|---|---|
        | `NEW` | `PENDING` | Tiếp tục poll |
        | `ACCEPTED` | `ACCEPTED` | Tiếp tục poll |
        | `COMPLETED` | `SIGNED` | Dừng, tải file bằng `identityKey` |
        | `REJECTED` | `REJECTED` | Dừng |
        | `FAILED`, `CANCELLED`, `CANCELED` (phòng hờ) | `FAILED` | Dừng |
        | `EXPIRED` (phòng hờ) | `EXPIRED` | Dừng |
        | giá trị khác | `PENDING` | Tiếp tục poll |

        Nguồn trong code: `app/api/sign/status/route.ts`, `lib/mapCasState.ts`.
      parameters:
        - name: signRequestId
          in: query
          required: true
          description: '`signRequestId` nhận từ `POST /api/sign/request`. Chỉ kiểm tra có mặt, không kiểm tra định dạng.'
          schema:
            type: string
          example: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
      responses:
        '200':
          description: Trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignStatusResponse'
              examples:
                pending:
                  summary: Đang chờ ký
                  value: { status: PENDING, rawState: NEW, signedAt: null, identityKeyExpiresAt: null }
                signed:
                  summary: Đã ký xong
                  value:
                    status: SIGNED
                    rawState: COMPLETED
                    signedAt: '2026-09-29T03:15:42.000Z'
                    identityKey: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
                    identityKeyExpiresAt: '2026-09-30T03:15:42.000Z'
                    orgIdSigned: kysoqr.com#3bLzsA
                rejected:
                  summary: Người ký từ chối
                  value: { status: REJECTED, rawState: REJECTED, signedAt: null, identityKeyExpiresAt: null }
        '400':
          description: Thiếu `signRequestId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Thiếu signRequestId
                  value: { error: MISSING_SIGN_REQUEST_ID, message: signRequestId query param is required }
          x-error-codes: [MISSING_SIGN_REQUEST_ID]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                status_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_STATUS_FAILED
                    message: Không thể kiểm tra trạng thái ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_STATUS_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_STATUS_FAILED]

  /api/sign/download:
    get:
      tags: [Ký số]
      operationId: downloadSignedPdf
      summary: Tải file PDF đã ký
      description: |
        Tải file PDF đã ký từ CAS. Server stream file về ngay, không lưu lại.

        Mỗi `identityKey` chỉ dùng được một số lần giới hạn phía CAS (ghi nhận thực tế: 5 lần; CAS chưa công bố con số
        chính thức và không cho biết còn bao nhiêu lượt), và hết hạn theo `identityKeyExpiresAt`. Hãy lưu file sau khi tải.

        Nguồn trong code: `app/api/sign/download/route.ts`, `lib/cas/casPayload.ts`.
      parameters:
        - name: identityKey
          in: query
          required: true
          description: '`identityKey` từ `GET /api/sign/status` khi `status = SIGNED`. **Không phải** `signRequestId`.'
          schema:
            type: string
          example: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
      responses:
        '200':
          description: Nội dung nhị phân của file PDF đã ký.
          headers:
            Content-Disposition:
              description: Luôn là `attachment; filename="signed.pdf"`.
              schema:
                type: string
                example: attachment; filename="signed.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Thiếu `identityKey`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Thiếu identityKey
                  value: { error: MISSING_IDENTITY_KEY, message: identityKey query param is required }
          x-error-codes: [MISSING_IDENTITY_KEY]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: '`identityKey` sai/hết hạn/hết lượt, CAS trả dữ liệu không phải PDF, hoặc CAS không phản hồi kịp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                download_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_DOWNLOAD_FAILED
                    message: Không thể tải file đã ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_DOWNLOAD_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_DOWNLOAD_FAILED]

  /api/verify/upload:
    post:
      tags: [Xác minh]
      operationId: verifyPdfUpload
      summary: Xác minh chữ ký trong file PDF
      description: |
        Xác minh bằng mật mã mọi chữ ký số trong PDF: chữ ký CMS, toàn vẹn nội dung, chuỗi chứng thư tới root CA tin cậy
        (tự tải CA trung gian qua AIA) và tình trạng thu hồi (OCSP/CRL). **Không phụ thuộc CAS**, không cần biến môi trường,
        xác minh được PDF ký bởi bất kỳ hệ thống nào.

        - File không có chữ ký → `{ "signatures": [] }`.
        - Chỉ xác minh **tối đa 10 chữ ký** đầu tiên; phần dư bị bỏ qua, không báo lỗi.
        - Trường tuỳ chọn **vắng mặt** (không phải `null`) khi không áp dụng.

        ### Loại chữ ký hỗ trợ

        | | Hỗ trợ | Chưa hỗ trợ |
        |---|---|---|
        | Thiết bị ký | USB Token, HSM / ký số từ xa (vd Cas ID), SIM PKI — xác minh như nhau | — |
        | Định dạng (SubFilter) | `adbe.pkcs7.detached`, `ETSI.CAdES.detached` | Còn lại, vd `ETSI.RFC3161` (dấu thời gian tài liệu) → `UNSUPPORTED_SUBFILTER` cho riêng mục đó |
        | Khoá / hàm băm | RSA với SHA-256/384/512 (SHA-1 chỉ với chữ ký không có signed attributes) | ECDSA và khoá khác → `UNSUPPORTED_ALGORITHM` |
        | CA tin cậy | Chuỗi về Root CA quốc gia đã bundle (Bộ TT&TT; NEAC: USB Token, ký từ xa, Mobile PKI); CA trung gian tải qua AIA | Root khác → `ROOT_NOT_TRUSTED` |
        | Dấu thời gian / LTV | — | Chưa được kiểm chứng |

        Nguồn trong code: `app/api/verify/upload/route.ts`, `lib/verification/verifyPdfSignatures.ts`, `lib/verification/certChainVerifier.ts`, `lib/verification/revocationChecker.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File PDF cần xác minh, tối đa **20 MiB** (20971520 byte).
                    Phải thoả cả 3: tên kết thúc `.pdf`, content type `application/pdf`, 5 byte đầu là `%PDF-`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Kết quả xác minh, mỗi phần tử ứng với 1 chữ ký theo thứ tự trong file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUploadResponse'
              examples:
                valid:
                  summary: Chữ ký hợp lệ
                  value:
                    signatures:
                      - status: SIGNED_VALID
                        message: The signature, content, and certificate chain are all valid.
                        signedAt: '2026-09-29T03:15:40.000Z'
                        certificate:
                          subject: CN=NGUYỄN VĂN A, C=VN
                          issuer: CN=CA Example, O=Example CA, C=VN
                          serialNumber: 5a1f0c
                          validFrom: '2026-01-01T00:00:00.000Z'
                          validTo: '2027-01-01T00:00:00.000Z'
                        certificateChain:
                          - index: 0
                            subject: CN=NGUYỄN VĂN A, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: 5a1f0c
                            validFrom: '2026-01-01T00:00:00.000Z'
                            validTo: '2027-01-01T00:00:00.000Z'
                            isCa: false
                            ocsp: { status: not_revoked, url: 'http://ocsp.example.vn' }
                            crl: { status: unavailable, url: null }
                          - index: 1
                            subject: CN=CA Example, O=Example CA, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: '01'
                            validFrom: '2020-01-01T00:00:00.000Z'
                            validTo: '2040-01-01T00:00:00.000Z'
                            isCa: true
                            ocsp: null
                            crl: null
                        certificateExpiredNow: false
                        contentIntact: true
                unsigned:
                  summary: File không có chữ ký
                  value: { signatures: [] }
                modified:
                  summary: Nội dung bị sửa sau khi ký
                  value:
                    signatures:
                      - status: CONTENT_DIGEST_MISMATCH
                        message: The PDF content does not match what was actually signed.
                        contentIntact: false
        '400':
          description: File không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                too_large:
                  summary: File lớn hơn 20 MiB (kiểm tra trước INVALID_PDF)
                  value: { error: FILE_TOO_LARGE, message: File exceeds the 20MB limit }
                invalid_pdf:
                  summary: File không phải PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                no_file:
                  summary: Thiếu file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes: [INVALID_MULTIPART, NO_FILE_UPLOADED, FILE_TOO_LARGE, INVALID_PDF]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Lỗi không lường trước khi xử lý cả file. Server báo lỗi thay vì trả danh sách rỗng,
            để không bị hiểu nhầm là "file không có chữ ký". Route này không bao giờ trả `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                failed:
                  summary: Lỗi xác minh
                  value: { error: VERIFICATION_FAILED, message: Failed to verify the uploaded PDF }
          x-error-codes: [VERIFICATION_FAILED]

  /api/verify/signing-round/{orgIdSigned}:
    get:
      tags: [Xác minh]
      operationId: getSigningRound
      summary: Tra cứu phiên ký theo mã
      description: |
        Tra cứu bản ghi của một phiên ký trên CAS theo mã `orgIdSigned`. Đây là **tra cứu dữ liệu CAS lưu lại**, không phải
        xác minh mật mã; muốn xác minh chữ ký trong file thì dùng `POST /api/verify/upload`.

        Các trường trong `signingRound` do CAS trả và được chuyển tiếp nguyên trạng.

        Nguồn trong code: `app/api/verify/signing-round/[orgIdSigned]/route.ts`, `lib/cas/CasProvider.ts` (`SigningRoundDetail`).
      parameters:
        - name: orgIdSigned
          in: path
          required: true
          description: |
            Mã phiên ký, lấy từ `orgIdSigned` của `GET /api/sign/status` (cũng được in trên file PDF đã ký).
            Có thể chứa tiền tố như `kysoqr.com#`. **Phải URL-encode** (`#` → `%23`), nếu không phần sau `#` bị cắt mất.
          schema:
            type: string
          example: kysoqr.com#3bLzsA
      responses:
        '200':
          description: '`signingRound` là `null` khi không tìm thấy (vẫn là HTTP 200, không phải lỗi).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRoundResponse'
              examples:
                found:
                  summary: Tìm thấy (giá trị minh hoạ; nội dung thực do CAS trả)
                  value:
                    signingRound:
                      device: {}
                      signer: { displayName: NGUYỄN VĂN A }
                      authMethod: Cas ID
                      signedAt: '2026-09-29T03:15:42.000Z'
                      certificate:
                        issuer: { commonName: CA Example, organization: Example CA, country: VN }
                        signer: { commonName: NGUYỄN VĂN A, country: VN, taxOrCitizenId: 'CCCD:001099012345' }
                        documentIntegrity: Không bị thay đổi
                        validFrom: '2026-01-01T00:00:00.000Z'
                        validTo: '2027-01-01T00:00:00.000Z'
                        signatureValidity: Hợp lệ tại thời điểm ký
                        hasTimestamp: Có
                        signedAtLong: 10:15:42 29/09/2026
                not_found:
                  summary: Không tìm thấy
                  value: { signingRound: null }
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                lookup_failed:
                  summary: CAS trả lỗi
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: Không thể tra cứu phiên ký. Vui lòng thử lại sau., detail: { casStatus: 500 } }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_SIGNING_ROUND_FAILED]

components:
  headers:
    RetryAfter:
      description: Số giây cần chờ trước khi gửi lại. Chỉ có với `RATE_LIMITED`.
      schema:
        type: integer
        minimum: 1
      example: 3

  responses:
    TooManyRequests:
      description: Vượt rate limit của KysoQR.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR giới hạn
              value: { error: RATE_LIMITED, message: Too many requests }
      x-error-codes: [RATE_LIMITED]
    TooManyRequestsCas:
      description: |
        `RATE_LIMITED`: vượt rate limit của KysoQR (có header `Retry-After`).
        `CAS_RATE_LIMITED`: CAS giới hạn tài khoản KysoQR (không có `Retry-After`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR giới hạn
              value: { error: RATE_LIMITED, message: Too many requests }
            cas_rate_limited:
              summary: CAS giới hạn
              value: { error: CAS_RATE_LIMITED, message: CAS is rate-limiting this client }
      x-error-codes: [RATE_LIMITED, CAS_RATE_LIMITED]
    CasNotConfigured:
      description: Server thiếu biến môi trường CAS (`CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID`, `CAS_ESIGN_API_KEY`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            not_configured:
              summary: Thiếu cấu hình CAS
              value: { error: CAS_NOT_CONFIGURED, message: Máy chủ chưa được cấu hình đầy đủ để ký số. Vui lòng liên hệ quản trị viên. }
      x-error-codes: [CAS_NOT_CONFIGURED]

  schemas:
    ApiError:
      type: object
      description: Body chung của mọi lỗi JSON.
      required: [error, message]
      properties:
        error:
          type: string
          description: Mã lỗi cố định; dùng để phân nhánh trong code. Danh sách mã của từng route nằm ở phần response tương ứng.
          example: INVALID_PDF
        message:
          type: string
          description: Thông báo cho người đọc (tiếng Việt hoặc tiếng Anh tuỳ lỗi). Không dùng để phân nhánh.
        detail:
          $ref: '#/components/schemas/CasErrorDetail'

    CasErrorDetail:
      description: Chỉ có ở lỗi 502 từ route gọi CAS. Vắng mặt khi lỗi không đến từ CAS và không phải timeout.
      oneOf:
        - title: CAS trả lỗi HTTP
          type: object
          properties:
            casErrorCode:
              type: string
              description: Mã lỗi của CAS, ví dụ `E_SIGN_CERTIFICATE_NOT_FOUND`.
            casStatus:
              type: integer
              description: HTTP status CAS trả về.
            casErrorType:
              type: string
              description: Loại lỗi của CAS.
            casRequestId:
              type: string
              description: '`requestId` của CAS, dùng khi tra soát với CAS.'
        - title: CAS không phản hồi kịp
          type: object
          required: [timeout]
          properties:
            timeout:
              type: boolean
              const: true

    SignatureFieldInput:
      type: object
      description: Một ô chữ ký. Toạ độ là tỉ lệ 0–1 so với trang, gốc ở góc trên bên trái (quy ước DOM). Server tự đổi sang quy ước của CAS.
      required: [page, xRatio, yRatio, widthRatio, heightRatio]
      properties:
        page:
          type: integer
          minimum: 1
          description: Số trang, bắt đầu từ 1.
        xRatio:
          type: number
          description: Mép trái của ô, tính từ mép trái trang. Số hữu hạn; bị kẹp về 0–1.
        yRatio:
          type: number
          description: Mép **trên** của ô, tính từ mép **trên** trang. Số hữu hạn; bị kẹp về 0–1.
        widthRatio:
          type: number
          minimum: 0.16
          maximum: 0.6
          description: Chiều rộng ô.
        heightRatio:
          type: number
          minimum: 0.055
          maximum: 0.22
          description: Chiều cao ô.

    SignRequestResponse:
      type: object
      required: [signRequestId, qrContent, state]
      properties:
        signRequestId:
          type: string
          format: uuid
          description: Mã yêu cầu ký, dùng cho `GET /api/sign/status`.
        qrContent:
          type: string
          description: Nội dung cần hiển thị thành mã QR, dạng `https://scan2grant.bankhub.vn?signToken=…`.
        state:
          type: string
          description: Trạng thái gốc từ CAS ngay sau khi tạo, thường là `NEW`.

    SignStatusResponse:
      type: object
      required: [status, rawState, signedAt, identityKeyExpiresAt]
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, SIGNED, REJECTED, FAILED, EXPIRED]
          description: Trạng thái đã chuẩn hoá; dùng trường này để phân nhánh.
        rawState:
          type: string
          description: 'Trạng thái gốc của CAS: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`.'
        signedAt:
          type: [string, 'null']
          format: date-time
          description: Thời điểm ký xong; `null` khi chưa ký xong.
        identityKey:
          type: string
          description: Khoá tải file qua `GET /api/sign/download`. Chỉ có khi `status = SIGNED`; vắng mặt trong các trường hợp khác.
        identityKeyExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Hạn dùng `identityKey`. Có giá trị khi `status = SIGNED`, còn lại `null`.
        orgIdSigned:
          type: string
          description: Mã tra cứu phiên ký cho `GET /api/verify/signing-round/{orgIdSigned}`, ví dụ `kysoqr.com#3bLzsA`. Chưa được CAS công bố chính thức; có thể vắng mặt.
        expiresIn:
          type: number
          description: Thời gian còn lại của yêu cầu ký (giây). Chưa được CAS công bố chính thức; có thể vắng mặt.

    VerifyUploadResponse:
      type: object
      required: [signatures]
      properties:
        signatures:
          type: array
          description: Mỗi phần tử ứng với 1 chữ ký, theo thứ tự trong file. Tối đa 10 phần tử.
          items:
            $ref: '#/components/schemas/VerificationResult'

    VerificationResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [SIGNED_VALID, ROOT_NOT_TRUSTED, CONTENT_DIGEST_MISMATCH, SIGNATURE_INVALID, CHAIN_VALIDATION_FAILED, TRUST_STORE_NOT_CONFIGURED, UNSUPPORTED_SUBFILTER, UNSUPPORTED_ALGORITHM]
          description: |
            - `SIGNED_VALID`: chữ ký, nội dung và chuỗi chứng thư đều hợp lệ.
            - `ROOT_NOT_TRUSTED`: chữ ký và nội dung hợp lệ về mật mã, nhưng root CA không có trong trust store của server.
            - `CONTENT_DIGEST_MISMATCH`: nội dung đã bị sửa sau khi ký (hoặc có dữ liệu thêm sau chữ ký cuối).
            - `SIGNATURE_INVALID`: chữ ký không khớp chứng thư, cấu trúc chữ ký hỏng, hoặc lỗi bất ngờ khi xác minh chữ ký này.
            - `CHAIN_VALIDATION_FAILED`: không có chuỗi chứng thư, hoặc chuỗi không hợp lệ.
            - `TRUST_STORE_NOT_CONFIGURED`: server chưa có root CA nào trong trust store.
            - `UNSUPPORTED_SUBFILTER`: mục này dùng định dạng chưa hỗ trợ (vd dấu thời gian tài liệu `ETSI.RFC3161`). Chỉ riêng mục đó bị báo, các chữ ký khác trong file vẫn được xác minh; chỉ có `status`, `message` và có thể có `signedAt`.
            - `UNSUPPORTED_ALGORITHM`: khoá của người ký không phải RSA (vd ECDSA), chưa xác minh được; `message` nêu tên thuật toán.
        message:
          type: string
          description: Câu mô tả cố định bằng tiếng Anh ứng với `status`.
        signedAt:
          type: string
          format: date-time
          description: Lấy từ `signingTime` trong CMS; không có thì lấy từ `/M` của PDF.
        certificate:
          $ref: '#/components/schemas/VerificationCertificate'
        certificateChain:
          type: array
          description: Phần tử 0 là người ký, phần tử cuối là root; issuer của mỗi phần tử là phần tử kế tiếp.
          items:
            $ref: '#/components/schemas/ChainCertInfo'
        certificateChainRootNotInTrustStore:
          type: boolean
          const: true
          description: Chỉ có khi `status = ROOT_NOT_TRUSTED`.
        certificateExpiredNow:
          type: boolean
          description: Chứng thư đã hết hạn tính đến hiện tại. Chỉ để thông tin, không đổi `status`.
        contentIntact:
          type: boolean
          description: '`true`: nội dung chưa bị sửa sau khi ký. `false`: đã bị sửa.'

    VerificationCertificate:
      type: object
      required: [subject, issuer, serialNumber, validFrom, validTo]
      properties:
        subject:
          type: string
          description: Chủ thể chứng thư (DN).
        issuer:
          type: string
          description: Đơn vị cấp (DN).
        serialNumber:
          type: string
          description: Số serial.
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time

    ChainCertInfo:
      type: object
      required: [index, subject, issuer, serialNumber, validFrom, validTo, isCa, ocsp, crl]
      properties:
        index:
          type: integer
          minimum: 0
          description: Vị trí trong chuỗi, từ 0.
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        isCa:
          type: boolean
          description: Có phải chứng thư CA không.
        ocsp:
          description: Kết quả OCSP so với issuer. `null` ở phần tử cuối (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'
        crl:
          description: Kết quả CRL so với issuer. `null` ở phần tử cuối (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'

    RevocationCheckResult:
      type: object
      description: Chỉ để thông tin; không bao giờ làm thay đổi `status` của chữ ký.
      required: [status, url]
      properties:
        status:
          type: string
          enum: [not_revoked, revoked, unavailable]
          description: '`unavailable` = không kiểm tra được (không có URL, lỗi mạng, phản hồi không hợp lệ); không có nghĩa là đã bị thu hồi.'
        url:
          type: [string, 'null']
          description: URL OCSP/CRL ghi trên chứng thư, có cả khi kiểm tra thất bại; `null` khi chứng thư không có URL đó.

    SigningRoundResponse:
      type: object
      required: [signingRound]
      properties:
        signingRound:
          description: '`null` khi không tìm thấy phiên ký.'
          oneOf:
            - $ref: '#/components/schemas/SigningRoundDetail'
            - type: 'null'

    SigningRoundDetail:
      type: object
      required: [device, signer, authMethod, signedAt, certificate]
      properties:
        device:
          type: object
          additionalProperties: true
          description: Thông tin thiết bị ký. CAS chưa công bố cấu trúc; coi là object key–value tuỳ ý.
        signer:
          type: object
          required: [displayName]
          properties:
            displayName:
              type: string
              description: Tên hiển thị của người ký.
        authMethod:
          type: string
          description: Phương thức xác thực người ký dùng khi ký.
        signedAt:
          type: [string, 'null']
          description: Thời điểm ký.
        certificate:
          type: object
          required: [issuer, signer, documentIntegrity, validFrom, validTo, signatureValidity, hasTimestamp, signedAtLong]
          properties:
            issuer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            signer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            documentIntegrity:
              type: string
              description: 'Đánh giá toàn vẹn tài liệu phía CAS, ví dụ `Không bị thay đổi` / `Not modified`.'
            validFrom:
              type: [string, 'null']
            validTo:
              type: [string, 'null']
            signatureValidity:
              type: string
              description: 'Đánh giá hiệu lực chữ ký phía CAS, ví dụ `Hợp lệ tại thời điểm ký` / `Valid at signing time`.'
            hasTimestamp:
              type: string
              description: 'Có dấu thời gian hay không, ví dụ `Có` / `Yes`. **Là chuỗi, không phải boolean.**'
            signedAtLong:
              type: [string, 'null']
              description: Thời điểm ký, dạng đầy đủ do CAS định dạng.

    SigningRoundCertParty:
      type: object
      required: [commonName, country]
      properties:
        commonName:
          type: [string, 'null']
        organization:
          type: [string, 'null']
          description: Có thể vắng mặt.
        country:
          type: [string, 'null']
        taxOrCitizenId:
          type: [string, 'null']
          description: 'MST hoặc CCCD; có thể có tiền tố `CCCD:`/`MST:`. Có thể vắng mặt.'
