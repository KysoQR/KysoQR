openapi: 3.1.0
info:
  title: KysoQR API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API của KysoQR: ký số PDF qua mã QR (thông qua CAS e-sign) và xác minh chữ ký số trong file PDF.

    Tài liệu này viết cho cả lập trình viên lẫn AI agent. File spec là nguồn sự thật cho request/response;
    nếu lệch với code thì code đúng (mỗi endpoint ghi file nguồn tương ứng). Tải spec:
    [`/openapi/vi.yaml`](/openapi/vi.yaml) · [`/openapi/en.yaml`](/openapi/en.yaml) — import thẳng vào Postman được.

    ## Luồng ký từ đầu đến cuối

    1. `POST /api/sign/request` → nhận `signRequestId`, `qrContent`.
    2. Hiển thị `qrContent` thành mã QR; người ký quét bằng app **Cas ID** và duyệt.
    3. `GET /api/sign/status?signRequestId=…` — poll mỗi 4 giây (gặp `429` thì chờ theo `Retry-After`).
       `PENDING`/`ACCEPTED` → tiếp tục; `SIGNED` → có `identityKey`, `orgIdSigned`; `REJECTED`/`FAILED`/`EXPIRED` → dừng.
    4. `GET /api/sign/download?identityKey=…` → file PDF đã ký.
    5. (tuỳ chọn) `GET /api/verify/signing-round/{orgIdSigned}` → bản ghi phiên ký từ CAS.
    6. (tuỳ chọn) `POST /api/verify/upload` với file vừa tải → xác minh chữ ký bằng mật mã.

    ## Quy ước chung

    - **Xác thực:** không có. Mọi route đều public. Không có header CORS, nên trình duyệt chỉ gọi được từ cùng origin; server khác gọi trực tiếp bình thường.
    - **Body lỗi:** `{ error, message, detail? }` (schema `ApiError`). Phân nhánh theo `error`, không theo `message`.
      `detail` chỉ có ở lỗi `502` từ route gọi CAS; vắng mặt khi lỗi không đến từ CAS và không phải timeout.
    - **Rate limit theo IP** (sign/request 20, sign/status 60, sign/download 20, verify/upload 20, verify/signing-round 30 request / 60 giây).
      Vượt giới hạn → `429 RATE_LIMITED` kèm header `Retry-After`. IP lấy từ `CF-Connecting-IP`, không có thì phần tử cuối của `X-Forwarded-For`.
      Bộ đếm nằm trong bộ nhớ từng tiến trình server. Khác với `429 CAS_RATE_LIMITED` (CAS giới hạn tài khoản KysoQR, không có `Retry-After`).
    - **Thiếu cấu hình CAS:** 4 route gọi CAS trả `500 CAS_NOT_CONFIGURED` nếu server thiếu `CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID` hoặc `CAS_ESIGN_API_KEY`. `POST /api/verify/upload` không cần các biến này.

    ## Tích hợp CAS e-sign

    KysoQR không tự ký; việc ký (khoá bí mật, HSM) do CAS e-sign thực hiện. Tài liệu chính thức của CAS:
    [cas.so/general/api/product-esign](https://cas.so/general/api/product-esign).

    | Route KysoQR | API CAS | Timeout |
    |---|---|---|
    | `POST /api/sign/request` | `POST /esign/request-document` (multipart) | 30 giây |
    | `GET /api/sign/status` | `POST /esign/request-status` | 10 giây |
    | `GET /api/sign/download` | `POST /esign/download-file` | 30 giây |
    | `GET /api/verify/signing-round/{orgIdSigned}` | `GET /esign/signing-round/{orgIdSigned}` | 10 giây |

    - Header gửi CAS: `x-client-id` = `CAS_ESIGN_CLIENT_ID`, `x-secret-key` = `CAS_ESIGN_API_KEY`. Không retry tự động.
    - Trạng thái CAS chính thức: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`. `FAILED`/`CANCELLED`/`CANCELED`/`EXPIRED` chỉ được xử lý phòng hờ.
    - `identityKey`/`identityKeyExpiresAt` chỉ có giá trị khi `COMPLETED`. `orgIdSigned`, `expiresIn` chưa được CAS công bố chính thức.
    - Đảo trục Y: KysoQR dùng mép trên tính từ đỉnh trang; CAS dùng mép dưới tính từ đáy: `yRatio_CAS = 1 − yRatio − heightRatio` (`SignatureField.toCasConvention()`).
    - `documentName` = tên file bỏ `.pdf`, xoá ký tự điều khiển, tối đa 240 ký tự; ngắn hơn 10 thì thêm ` - KysoQR` (`lib/documentName.ts`).
    - Mã lỗi CAS xử lý riêng: HTTP 429 → `CAS_RATE_LIMITED`; `E_SIGN_PERSON_NOT_FOUND` → tự gửi lại dạng chỉ-QR;
      `E_SIGN_CERTIFICATE_NOT_FOUND` → `CAS_CERTIFICATE_NOT_FOUND`; `E_SIGN_SIGNING_ROUND_NOT_FOUND` → `200 { signingRound: null }`.
    - Kết nối ra ngoài của server: host trong `CAS_ESIGN_BASE_URL`, và các host AIA/OCSP/CRL ghi trên chứng thư (qua `lib/verification/guardedFetch.ts`, chặn IP nội bộ).

    Nguồn trong code: `lib/cas/CasEsignProvider.ts`, `lib/cas/casPayload.ts`, `lib/casErrorDetail.ts`, `lib/mapCasState.ts`, `lib/env.ts`.

    ## Ký bằng VNeID (CSign Gateway của CMC)

    1. `POST /api/vneid/sign` (PDF, CCCD, ô ký) → `transactionId`, `clientSecret`, `confirmDeadline`, `expiresAt`.
       Người ký nhận thông báo trên app **VNeID** và có 5 phút để xác nhận.
    2. `POST /api/vneid/status` với `Authorization: Bearer <clientSecret>` cho tới khi `status` là `SIGNED` (hoặc kết thúc).
    3. `POST /api/vneid/finalize` với đúng file PDF gốc → file PDF đã ký.

    CSign báo kết quả cho server qua `POST /api/vneid/webhook`. Các route VNeID là public nhưng chỉ nhận request có
    `Origin` của trang KysoQR; mọi response có `Cache-Control: no-store`. Thiếu cấu hình → `503 VNEID_NOT_CONFIGURED`.
  contact:
    name: KysoQR trên GitHub
    url: https://github.com/KysoQR/KysoQR

servers:
  - url: /
    description: Server đang mở trang này

tags:
  - name: Ký số
    description: Tạo yêu cầu ký, theo dõi trạng thái và tải file đã ký qua CAS e-sign.
  - name: Xác minh
    description: Xác minh chữ ký số trong PDF và tra cứu phiên ký.
  - name: Ký bằng VNeID
    description: Ký PDF bằng chứng thư số trên app VNeID, qua CSign Gateway của CMC.

paths:
  /api/sign/request:
    post:
      tags: [Ký số]
      operationId: createSignRequest
      summary: Tạo yêu cầu ký
      description: |
        Tạo một yêu cầu ký số trên CAS cho 1 file PDF, trả về nội dung QR để người ký quét bằng app **Cas ID**.
        `signRequestId` do KysoQR sinh (UUID v4). Server không lưu gì: file được gửi thẳng sang CAS trong cùng request.

        Nếu có `identificationNumber` mà CAS trả `E_SIGN_PERSON_NOT_FOUND` (số CCCD chưa đăng ký Cas ID),
        server tự gửi lại **một lần** chỉ dùng QR, giữ nguyên `signRequestId`; bên gọi vẫn nhận `200`.

        **Lưu ý:** gửi thử request này tạo yêu cầu ký thật trên CAS.

        Nguồn trong code: `app/api/sign/request/route.ts`, `lib/domain/SignatureField.ts`, `lib/domain/CasSignerConfig.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, signatureFields]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File PDF cần ký, tối đa **10 MiB** (10485760 byte, giới hạn của CAS).
                    Phải thoả cả 3: tên kết thúc `.pdf`, content type `application/pdf`, 5 byte đầu là `%PDF-`.
                signatureFields:
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/SignatureFieldInput'
                  description: |
                    Mảng JSON các ô chữ ký (xem schema `SignatureFieldInput`). Ít nhất 1 ô; không giới hạn số ô mỗi trang.
                    Toạ độ là tỉ lệ 0–1, gốc ở góc trên bên trái trang.
                  example: '[{"page":1,"xRatio":0.52,"yRatio":0.78,"widthRatio":0.34,"heightRatio":0.1}]'
                signerType:
                  type: string
                  enum: [individual, enterprise]
                  default: individual
                  description: Loại người ký. Giá trị khác → `400 INVALID_SIGNER_CONFIG`.
                identificationNumber:
                  type: string
                  pattern: '^\d{9}$|^\d{12}$'
                  description: |
                    Số CCCD (12 số) hoặc CMND (9 số). Có giá trị thì CAS gửi thêm thông báo đẩy tới app Cas ID của người đó.
                    Để trống thì chỉ dùng QR. Cố ý không có giá trị mẫu, để lệnh copy từ tài liệu không gửi nhầm thông báo tới người thật.
                taxCode:
                  type: string
                  pattern: '^\d{10}$|^\d{10}-\d{3}$'
                  description: Mã số thuế. **Bắt buộc khi `signerType=enterprise`** (thiếu → `400 INVALID_SIGNER_CONFIG`, message `taxCode is required for enterprise signers`); bỏ qua khi ký cá nhân. 10 số, hoặc 10 số + `-` + 3 số.
                organizationName:
                  type: string
                  description: Tên tổ chức, chỉ dùng khi `signerType=enterprise`. Gửi sang CAS nếu khác rỗng.
                representativeName:
                  type: string
                  description: Người đại diện, chỉ dùng khi `signerType=enterprise`. Được kiểm tra nhưng **không gửi sang CAS**.
                language:
                  type: string
                  enum: [vi, en]
                  default: vi
                  description: Ngôn ngữ hiển thị phía CAS. Giá trị khác → `400 INVALID_LANGUAGE`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Tạo yêu cầu ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignRequestResponse'
              examples:
                success:
                  summary: Thành công
                  value:
                    signRequestId: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
                    qrContent: https://scan2grant.bankhub.vn?signToken=eyJhbGciOi...
                    state: NEW
        '400':
          description: Request không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                invalid_pdf:
                  summary: File không phải PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                too_large:
                  summary: File lớn hơn 10 MiB
                  value: { error: DOCUMENT_TOO_LARGE_FOR_CAS, message: File exceeds the 10MB limit CAS enforces }
                invalid_signature_fields:
                  summary: signatureFields sai
                  value: { error: INVALID_SIGNATURE_FIELDS, message: 'widthRatio must be between 0.16 and 0.6, got 0.9' }
                invalid_signer_config:
                  summary: Thông tin người ký sai
                  value: { error: INVALID_SIGNER_CONFIG, message: identificationNumber must be 9 or 12 digits }
                enterprise_missing_tax_code:
                  summary: Ký doanh nghiệp thiếu MST
                  value: { error: INVALID_SIGNER_CONFIG, message: taxCode is required for enterprise signers }
                invalid_language:
                  summary: language sai
                  value: { error: INVALID_LANGUAGE, message: 'language must be "vi" or "en"' }
                no_file:
                  summary: Thiếu file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes:
            - INVALID_MULTIPART
            - NO_FILE_UPLOADED
            - INVALID_PDF
            - DOCUMENT_TOO_LARGE_FOR_CAS
            - INVALID_SIGNATURE_FIELDS
            - INVALID_SIGNER_CONFIG
            - INVALID_LANGUAGE
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                submit_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: Không thể gửi yêu cầu ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400, casRequestId: "-CwlQfsQfdim_y2q" }
                timeout:
                  summary: CAS không phản hồi kịp
                  value:
                    error: CAS_SUBMIT_FAILED
                    message: CAS không phản hồi kịp thời. Vui lòng thử lại sau.
                    detail: { timeout: true }
                certificate_not_found:
                  summary: CAS không tìm thấy chứng thư số
                  value:
                    error: CAS_CERTIFICATE_NOT_FOUND
                    message: Không tìm thấy thông tin người dùng bên CAS.
                    detail: { casErrorCode: E_SIGN_CERTIFICATE_NOT_FOUND }
          x-error-codes: [CAS_SUBMIT_FAILED, CAS_CERTIFICATE_NOT_FOUND]

  /api/sign/status:
    get:
      tags: [Ký số]
      operationId: getSignStatus
      summary: Tra cứu trạng thái yêu cầu ký
      description: |
        Proxy gọi thẳng `request-status` của CAS, không cache.

        Poll khuyến nghị: mỗi 4 giây; gặp `429` thì chờ theo `Retry-After` (hoặc 8 giây); lỗi khác chờ 6 giây;
        dừng khi `status` là `SIGNED`, `REJECTED`, `FAILED` hoặc `EXPIRED`.

        | `rawState` (CAS) | `status` | Nên làm |
        |---|---|---|
        | `NEW` | `PENDING` | Tiếp tục poll |
        | `ACCEPTED` | `ACCEPTED` | Tiếp tục poll |
        | `COMPLETED` | `SIGNED` | Dừng, tải file bằng `identityKey` |
        | `REJECTED` | `REJECTED` | Dừng |
        | `FAILED`, `CANCELLED`, `CANCELED` (phòng hờ) | `FAILED` | Dừng |
        | `EXPIRED` (phòng hờ) | `EXPIRED` | Dừng |
        | giá trị khác | `PENDING` | Tiếp tục poll |

        Nguồn trong code: `app/api/sign/status/route.ts`, `lib/mapCasState.ts`.
      parameters:
        - name: signRequestId
          in: query
          required: true
          description: '`signRequestId` nhận từ `POST /api/sign/request`. Chỉ kiểm tra có mặt, không kiểm tra định dạng.'
          schema:
            type: string
          example: fd2d7767-29b3-4de3-98f2-31fb1ecfb8f0
      responses:
        '200':
          description: Trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignStatusResponse'
              examples:
                pending:
                  summary: Đang chờ ký
                  value: { status: PENDING, rawState: NEW, signedAt: null, identityKeyExpiresAt: null }
                signed:
                  summary: Đã ký xong
                  value:
                    status: SIGNED
                    rawState: COMPLETED
                    signedAt: '2026-09-29T03:15:42.000Z'
                    identityKey: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
                    identityKeyExpiresAt: '2026-09-30T03:15:42.000Z'
                    orgIdSigned: kysoqr.com#3bLzsA
                rejected:
                  summary: Người ký từ chối
                  value: { status: REJECTED, rawState: REJECTED, signedAt: null, identityKeyExpiresAt: null }
        '400':
          description: Thiếu `signRequestId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Thiếu signRequestId
                  value: { error: MISSING_SIGN_REQUEST_ID, message: signRequestId query param is required }
          x-error-codes: [MISSING_SIGN_REQUEST_ID]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                status_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_STATUS_FAILED
                    message: Không thể kiểm tra trạng thái ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_STATUS_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_STATUS_FAILED]

  /api/sign/download:
    get:
      tags: [Ký số]
      operationId: downloadSignedPdf
      summary: Tải file PDF đã ký
      description: |
        Tải file PDF đã ký từ CAS. Server stream file về ngay, không lưu lại.

        Mỗi `identityKey` chỉ dùng được một số lần giới hạn phía CAS (ghi nhận thực tế: 5 lần; CAS chưa công bố con số
        chính thức và không cho biết còn bao nhiêu lượt), và hết hạn theo `identityKeyExpiresAt`. Hãy lưu file sau khi tải.

        Nguồn trong code: `app/api/sign/download/route.ts`, `lib/cas/casPayload.ts`.
      parameters:
        - name: identityKey
          in: query
          required: true
          description: '`identityKey` từ `GET /api/sign/status` khi `status = SIGNED`. **Không phải** `signRequestId`.'
          schema:
            type: string
          example: 6f1c2b8e-4a0d-4f7e-9b21-3c5d7e9f1a2b
      responses:
        '200':
          description: Nội dung nhị phân của file PDF đã ký.
          headers:
            Content-Disposition:
              description: Luôn là `attachment; filename="signed.pdf"`.
              schema:
                type: string
                example: attachment; filename="signed.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Thiếu `identityKey`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missing:
                  summary: Thiếu identityKey
                  value: { error: MISSING_IDENTITY_KEY, message: identityKey query param is required }
          x-error-codes: [MISSING_IDENTITY_KEY]
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: '`identityKey` sai/hết hạn/hết lượt, CAS trả dữ liệu không phải PDF, hoặc CAS không phản hồi kịp.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                download_failed:
                  summary: CAS trả lỗi
                  value:
                    error: CAS_DOWNLOAD_FAILED
                    message: Không thể tải file đã ký. Vui lòng thử lại sau.
                    detail: { casStatus: 400 }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_DOWNLOAD_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_DOWNLOAD_FAILED]

  /api/verify/upload:
    post:
      tags: [Xác minh]
      operationId: verifyPdfUpload
      summary: Xác minh chữ ký trong file PDF
      description: |
        Xác minh bằng mật mã mọi chữ ký số trong PDF: chữ ký CMS, toàn vẹn nội dung, chuỗi chứng thư tới root CA tin cậy
        (tự tải CA trung gian qua AIA) và tình trạng thu hồi (OCSP/CRL). **Không phụ thuộc CAS**, không cần biến môi trường,
        xác minh được PDF ký bởi bất kỳ hệ thống nào.

        - File không có chữ ký → `{ "signatures": [] }`.
        - Xác minh **mọi chữ ký** trong file, không giới hạn số lượng (server chạy tối đa 4 chữ ký cùng lúc).
        - Trường tuỳ chọn **vắng mặt** (không phải `null`) khi không áp dụng.

        ### Loại chữ ký hỗ trợ

        | | Hỗ trợ | Chưa hỗ trợ |
        |---|---|---|
        | Thiết bị ký | USB Token, HSM / ký số từ xa (vd Cas ID), SIM PKI — xác minh như nhau | — |
        | Định dạng (SubFilter) | `adbe.pkcs7.detached`, `ETSI.CAdES.detached` | Còn lại, vd `ETSI.RFC3161` (dấu thời gian tài liệu) → `UNSUPPORTED_SUBFILTER` cho riêng mục đó |
        | Khoá / hàm băm | RSA với SHA-256/384/512 (SHA-1 chỉ với chữ ký không có signed attributes) | ECDSA và khoá khác → `UNSUPPORTED_ALGORITHM` |
        | CA tin cậy | Chuỗi về Root CA quốc gia đã bundle (Bộ TT&TT; NEAC: USB Token, ký từ xa, Mobile PKI); CA trung gian tải qua AIA | Root khác → `ROOT_NOT_TRUSTED` |
        | Dấu thời gian / LTV | — | Chưa được kiểm chứng |

        Nguồn trong code: `app/api/verify/upload/route.ts`, `lib/verification/verifyPdfSignatures.ts`, `lib/verification/certChainVerifier.ts`, `lib/verification/revocationChecker.ts`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    File PDF cần xác minh, tối đa **20 MiB** (20971520 byte).
                    Phải thoả cả 3: tên kết thúc `.pdf`, content type `application/pdf`, 5 byte đầu là `%PDF-`.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '200':
          description: Kết quả xác minh, mỗi phần tử ứng với 1 chữ ký theo thứ tự trong file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUploadResponse'
              examples:
                valid:
                  summary: Chữ ký hợp lệ
                  value:
                    signatures:
                      - status: SIGNED_VALID
                        message: The signature, content, and certificate chain are all valid.
                        signedAt: '2026-09-29T03:15:40.000Z'
                        certificate:
                          subject: CN=NGUYỄN VĂN A, C=VN
                          issuer: CN=CA Example, O=Example CA, C=VN
                          serialNumber: 5a1f0c
                          validFrom: '2026-01-01T00:00:00.000Z'
                          validTo: '2027-01-01T00:00:00.000Z'
                        certificateChain:
                          - index: 0
                            subject: CN=NGUYỄN VĂN A, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: 5a1f0c
                            validFrom: '2026-01-01T00:00:00.000Z'
                            validTo: '2027-01-01T00:00:00.000Z'
                            isCa: false
                            ocsp: { status: not_revoked, url: 'http://ocsp.example.vn' }
                            crl: { status: unavailable, url: null }
                          - index: 1
                            subject: CN=CA Example, O=Example CA, C=VN
                            issuer: CN=CA Example, O=Example CA, C=VN
                            serialNumber: '01'
                            validFrom: '2020-01-01T00:00:00.000Z'
                            validTo: '2040-01-01T00:00:00.000Z'
                            isCa: true
                            ocsp: null
                            crl: null
                        certificateExpiredNow: false
                        contentIntact: true
                        position: 1
                unsigned:
                  summary: File không có chữ ký
                  value: { signatures: [] }
                modified:
                  summary: Nội dung bị sửa sau khi ký
                  value:
                    signatures:
                      - status: CONTENT_DIGEST_MISMATCH
                        message: The PDF content does not match what was actually signed.
                        contentIntact: false
                        position: 1
        '400':
          description: File không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                too_large:
                  summary: File lớn hơn 20 MiB (kiểm tra trước INVALID_PDF)
                  value: { error: FILE_TOO_LARGE, message: File exceeds the 20MB limit }
                invalid_pdf:
                  summary: File không phải PDF
                  value: { error: INVALID_PDF, message: Uploaded file is not a valid PDF }
                no_file:
                  summary: Thiếu file
                  value: { error: NO_FILE_UPLOADED, message: 'Missing required "file" field' }
          x-error-codes: [INVALID_MULTIPART, NO_FILE_UPLOADED, FILE_TOO_LARGE, INVALID_PDF]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: |
            Lỗi không lường trước khi xử lý cả file. Server báo lỗi thay vì trả danh sách rỗng,
            để không bị hiểu nhầm là "file không có chữ ký". Route này không bao giờ trả `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                failed:
                  summary: Lỗi xác minh
                  value: { error: VERIFICATION_FAILED, message: Failed to verify the uploaded PDF }
          x-error-codes: [VERIFICATION_FAILED]

  /api/verify/signing-round/{orgIdSigned}:
    get:
      tags: [Xác minh]
      operationId: getSigningRound
      summary: Tra cứu phiên ký theo mã
      description: |
        Tra cứu bản ghi của một phiên ký trên CAS theo mã `orgIdSigned`. Đây là **tra cứu dữ liệu CAS lưu lại**, không phải
        xác minh mật mã; muốn xác minh chữ ký trong file thì dùng `POST /api/verify/upload`.

        Các trường trong `signingRound` do CAS trả và được chuyển tiếp nguyên trạng.

        Nguồn trong code: `app/api/verify/signing-round/[orgIdSigned]/route.ts`, `lib/cas/CasProvider.ts` (`SigningRoundDetail`).
      parameters:
        - name: orgIdSigned
          in: path
          required: true
          description: |
            Mã phiên ký, lấy từ `orgIdSigned` của `GET /api/sign/status` (cũng được in trên file PDF đã ký).
            Có thể chứa tiền tố như `kysoqr.com#`. **Phải URL-encode** (`#` → `%23`), nếu không phần sau `#` bị cắt mất.
          schema:
            type: string
          example: kysoqr.com#3bLzsA
      responses:
        '200':
          description: '`signingRound` là `null` khi không tìm thấy (vẫn là HTTP 200, không phải lỗi).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningRoundResponse'
              examples:
                found:
                  summary: Tìm thấy (giá trị minh hoạ; nội dung thực do CAS trả)
                  value:
                    signingRound:
                      device: {}
                      signer: { displayName: NGUYỄN VĂN A }
                      authMethod: Cas ID
                      signedAt: '2026-09-29T03:15:42.000Z'
                      certificate:
                        issuer: { commonName: CA Example, organization: Example CA, country: VN }
                        signer: { commonName: NGUYỄN VĂN A, country: VN, taxOrCitizenId: 'CCCD:001099012345' }
                        documentIntegrity: Không bị thay đổi
                        validFrom: '2026-01-01T00:00:00.000Z'
                        validTo: '2027-01-01T00:00:00.000Z'
                        signatureValidity: Hợp lệ tại thời điểm ký
                        hasTimestamp: Có
                        signedAtLong: 10:15:42 29/09/2026
                not_found:
                  summary: Không tìm thấy
                  value: { signingRound: null }
        '429':
          $ref: '#/components/responses/TooManyRequestsCas'
        '500':
          $ref: '#/components/responses/CasNotConfigured'
        '502':
          description: CAS trả lỗi hoặc không phản hồi kịp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                lookup_failed:
                  summary: CAS trả lỗi
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: Không thể tra cứu phiên ký. Vui lòng thử lại sau., detail: { casStatus: 500 } }
                timeout:
                  summary: CAS không phản hồi kịp
                  value: { error: CAS_SIGNING_ROUND_FAILED, message: CAS không phản hồi kịp thời. Vui lòng thử lại sau., detail: { timeout: true } }
          x-error-codes: [CAS_SIGNING_ROUND_FAILED]

  /api/vneid/sign:
    post:
      tags: [Ký bằng VNeID]
      operationId: startVneidSigning
      summary: Gửi yêu cầu ký bằng VNeID
      description: |
        Kiểm tra, chuẩn bị file PDF rồi gửi yêu cầu ký sang CSign Gateway (CMC). Người ký nhận thông báo
        "Xác nhận yêu cầu ký số" trên app **VNeID**, có **5 phút** để xác nhận; giao dịch tồn tại tối đa **30 phút**.

        - Client chỉ gửi file PDF, số CCCD, vị trí ô ký và ngôn ngữ. Mọi mã gửi sang CSign (`requestId`, `documentId`, digest) do server sinh.
        - Chứng thư số của CCCD được kiểm tra (đúng CCCD, khoá RSA, còn hạn, chuỗi CA được tin cậy) **trước khi** gửi thông báo.
        - Mỗi CCCD chỉ có một yêu cầu đang chờ (`409 VNEID_REQUEST_PENDING`).
        - Giữ `transactionId` và `clientSecret` để gọi `/api/vneid/status` và `/api/vneid/finalize`; `clientSecret` chỉ trả về một lần.
        - Bắt buộc header `Origin` của trang KysoQR và `Content-Length` (tối đa 10,5MB). Khi server bật Turnstile: header `x-turnstile-token` (action `vneid_sign`).
        - Rate limit: 30 request / 10 phút / IP.

        Nguồn trong code: `app/api/vneid/sign/route.ts`, `lib/vneid/service.ts`, `lib/vneid/certPolicy.ts`, `lib/pdfSign/`.
      parameters:
        - name: x-turnstile-token
          in: header
          required: false
          description: Token Cloudflare Turnstile. Chỉ bắt buộc khi server đặt `TURNSTILE_SECRET`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, citizenPid, signatureFields]
              properties:
                file:
                  type: string
                  format: binary
                  description: File PDF (đuôi `.pdf`, `application/pdf`, tối đa 10MB, không đặt mật khẩu, không bị khoá chỉnh sửa).
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  description: Số CCCD 12 chữ số của người ký. Không được lưu, ghi log hay trả lại.
                  example: '001099012345'
                signatureFields:
                  type: string
                  description: 'Mảng JSON (tối đa 4096 ký tự) gồm 1–10 phần tử `SignatureFieldInput`. Ví dụ: `[{"page":1,"xRatio":0.55,"yRatio":0.78,"widthRatio":0.34,"heightRatio":0.1}]`'
                language:
                  type: string
                  enum: [vi, en]
                  default: vi
                  description: Ngôn ngữ của chữ trong ô ký và của thông báo lỗi.
                credentialId:
                  type: string
                  pattern: '^[0-9A-Fa-f]{1,64}$'
                  description: |
                    (Tuỳ chọn) `credentialId` của chứng thư người dùng đã chọn từ `POST /api/vneid/credentials`.
                    Server tra lại `credentials/list` và kiểm lại chứng thư đó; không có hoặc không dùng được → `422`.
                    Bỏ trống thì server tự chọn chứng thư dùng được còn hạn lâu nhất.
      responses:
        '200':
          description: Đã gửi yêu cầu sang VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidSignResponse'
        '400':
          description: Số CCCD, file hoặc ô ký không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { error: VNEID_INVALID_INPUT, message: 'Thông tin gửi lên không hợp lệ.' }
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: |
            `VNEID_FORBIDDEN_ORIGIN`: thiếu `Origin` hoặc không phải trang KysoQR.
            `VNEID_CHALLENGE_FAILED`: thiếu hoặc sai token Turnstile.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CHALLENGE_FAILED, VNEID_ACCESS_DENIED]
        '409':
          description: CCCD này đang có một yêu cầu chờ xác nhận (ở KysoQR hoặc ở CSign, mã `-01`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_REQUEST_PENDING]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: |
            `VNEID_PDF_REJECTED`: không ký được file này (mật khẩu, bị khoá, hỏng, cấu trúc không hỗ trợ).
            `VNEID_NO_CERTIFICATE`: CCCD chưa có chứng thư (CSign `04`, `4029`, `4031`).
            `VNEID_CERT_INVALID`: chứng thư chưa kích hoạt, hết hạn, sai CCCD hoặc khoá không hỗ trợ.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_PDF_REJECTED, VNEID_NO_CERTIFICATE, VNEID_CERT_INVALID]
        '429':
          description: |
            `RATE_LIMITED`: vượt rate limit theo IP.
            `VNEID_CITIZEN_LIMITED`: CCCD có từ 10 yêu cầu bị từ chối/bỏ qua trong 24 giờ; tạm dừng 1 giờ.
            Cả hai có header `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED, VNEID_CITIZEN_LIMITED]
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign trả lỗi, không phản hồi kịp hoặc trả dữ liệu không đọc được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: |
            `VNEID_NOT_CONFIGURED`: server chưa cấu hình ký VNeID.
            `VNEID_DAILY_CAP`: hết hạn mức yêu cầu trong ngày (có `Retry-After`).
            `VNEID_BUSY`: đang xử lý nhiều file; thử lại sau vài giây.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED, VNEID_DAILY_CAP, VNEID_BUSY]

  /api/vneid/credentials:
    post:
      tags: [Ký bằng VNeID]
      operationId: listVneidCredentials
      summary: Liệt kê chứng thư số của một CCCD
      description: |
        Gọi `credentials/list` của CSign cho số CCCD rồi kiểm từng chứng thư (đúng CCCD, khoá RSA, còn hạn, chuỗi CA ký đúng),
        để người dùng chọn chứng thư trước khi ký. **Không gửi thông báo nào tới điện thoại.**

        - Không trả tên người giữ chứng thư hay CCCD: ai cũng gõ được số bất kỳ, nên câu trả lời không được thành công cụ tra tên.
        - Sắp xếp: chứng thư dùng được trước, rồi theo hạn xa nhất.
        - Chuỗi CA CSign gửi kèm không khớp **không** làm chứng thư bị loại (CSign báo nó đang hoạt động); chỉ đánh `chainVerified: false`.
        - Bắt buộc header `Origin` của trang KysoQR và `Content-Length` (tối đa 1KB).
        - Rate limit: 20 request / 10 phút / IP và 10 / 10 phút / CCCD.

        Nguồn trong code: `app/api/vneid/credentials/route.ts`, `lib/vneid/service.ts` (`listCredentialsForCitizen`), `lib/vneid/certPolicy.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenPid]
              properties:
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  example: '001099012345'
      responses:
        '200':
          description: Danh sách chứng thư.
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/VneidCredential'
        '400':
          description: Body không phải JSON hoặc số CCCD không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: |
            Thiếu `Origin` hoặc không phải trang KysoQR.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_ACCESS_DENIED]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: CCCD chưa có chứng thư số trên CSign (hoặc số CCCD không đúng).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NO_CERTIFICATE]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign trả lỗi, không phản hồi kịp hoặc trả dữ liệu không đọc được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: |
            `VNEID_NOT_CONFIGURED`: server chưa cấu hình ký VNeID.
            `VNEID_DAILY_CAP`: hết hạn mức tra cứu chứng thư trong ngày của toàn hệ thống (có `Retry-After`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED, VNEID_DAILY_CAP]

  /api/vneid/providers:
    get:
      tags: [Ký bằng VNeID]
      operationId: listVneidProviders
      summary: Danh sách nhà cung cấp chứng thư và các gói
      description: |
        Gọi `provider/list` của CSign: các nhà cung cấp (CA) và gói chứng thư của từng nhà, **kể cả gói có phí** (kèm đơn giá),
        để người chưa có chứng thư chọn khi đăng ký mới. Không nhận và không trả dữ liệu cá nhân.

        - Không lọc theo trạng thái nhà cung cấp: spec CSign mâu thuẫn về giá trị `status`. Nhà cung cấp đang tắt sẽ bị CSign từ chối lúc đăng ký (`VNEID_PROVIDER_UNAVAILABLE`).
        - Server chỉ hỏi CSign tối đa 10 phút một lần.
        - Rate limit: 30 request / 10 phút / IP.

        Nguồn trong code: `app/api/vneid/providers/route.ts`, `lib/vneid/registration.ts` (`listProviders`).
      responses:
        '200':
          description: Các nhà cung cấp và gói.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VneidProvider'
        '403':
          description: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_ACCESS_DENIED]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign trả lỗi, không phản hồi kịp hoặc trả dữ liệu không đọc được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: Server chưa cấu hình ký VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/registrations:
    post:
      tags: [Ký bằng VNeID]
      operationId: registerVneidCertificate
      summary: Đăng ký chứng thư mới cho người chưa có
      description: |
        Gửi `credentials/register` tới CSign cho CCCD, với nhà cung cấp và gói chọn từ `/api/vneid/providers`.
        Sau đó CSign gửi yêu cầu **chia sẻ thông tin** tới app VNeID của người dân; người dân đồng ý, CA cấp chứng thư,
        rồi người dân **kích hoạt** chứng thư trong app. Theo dõi bằng `/api/vneid/registrations/status`.

        - Form (`userInfo`) chỉ được gửi tới CSign: không lưu, không ghi log, không trả lại. Server chỉ giữ nhà cung cấp, gói, trạng thái và mã lỗi của CSign, theo HMAC của CCCD, trong **30 phút** kể từ lúc gửi (thời gian sống của một giao dịch CSign, `errorcode07`), rồi xoá hẳn dù kết quả ra sao.
        - Ngày gửi dạng `YYYY-MM-DD`; server đổi sang `dd/MM/yyyy` cho CSign.
        - Mỗi CCCD một yêu cầu đang mở.
        - Bắt buộc header `Origin`, `Content-Length` (tối đa 8KB) và `x-turnstile-token` khi server bật Turnstile.
        - Rate limit: 5 request / 10 phút / IP.

        Nguồn trong code: `app/api/vneid/registrations/route.ts`, `lib/vneid/registration.ts` (`startRegistration`), `lib/vneid/registrationForm.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidRegistrationRequest'
      responses:
        '201':
          description: CSign đã nhận yêu cầu; người dân tiếp tục trên VNeID.
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    $ref: '#/components/schemas/VneidRegistration'
        '400':
          description: |
            `VNEID_INVALID_INPUT`: body không phải JSON hoặc số CCCD không hợp lệ.
            `VNEID_REGISTRATION_INVALID`: form thiếu hoặc sai (họ tên, ngày, số điện thoại, email...), hoặc CSign không nhận thông tin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT, VNEID_REGISTRATION_INVALID]
        '403':
          description: |
            Thiếu `Origin`, không phải trang KysoQR, hoặc Turnstile không qua.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CHALLENGE_FAILED, VNEID_ACCESS_DENIED]
        '409':
          description: |
            `VNEID_REGISTRATION_PENDING`: CCCD đang có yêu cầu đăng ký (hoặc yêu cầu khác) chờ trên VNeID.
            `VNEID_ALREADY_REGISTERED`: CCCD đã có chứng thư miễn phí của nhà cung cấp này (CSign `19` / `30`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_REGISTRATION_PENDING, VNEID_ALREADY_REGISTERED]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '422':
          description: Nhà cung cấp hoặc gói không có trong danh sách của CSign, hoặc đang tắt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_PROVIDER_UNAVAILABLE]
        '429':
          description: Vượt rate limit theo IP. Có header `Retry-After`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED]
        '500':
          $ref: '#/components/responses/VneidInternal'
        '502':
          description: CSign trả lỗi, không phản hồi kịp hoặc trả dữ liệu không đọc được.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_UPSTREAM]
        '503':
          description: Server chưa cấu hình ký VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/registrations/status:
    post:
      tags: [Ký bằng VNeID]
      operationId: getVneidRegistration
      summary: Trạng thái đăng ký chứng thư của một CCCD
      description: |
        Yêu cầu đăng ký chứng thư của CCCD trong 30 phút kể từ lúc gửi (đang mở hoặc đã kết thúc). Trả `null` nếu không có; quá 30 phút yêu cầu bị xoá nên cũng trả `null`.
        Tra theo CCCD nên sau khi tải lại trang, nhập lại CCCD là thấy lại yêu cầu. Trang gọi route này vài giây một lần trong lúc chờ.

        - Server hỏi `credentials/get-status` của CSign tối đa 5 giây/lần (một yêu cầu đăng ký sống tối đa 30 phút).
        - Không có tên hay dữ liệu cá nhân trong câu trả lời.
        - Bắt buộc header `Origin` của trang KysoQR và `Content-Length` (tối đa 1KB).
        - Rate limit: 60 request / phút / IP và 30 / phút / CCCD.

        Nguồn trong code: `app/api/vneid/registrations/status/route.ts`, `lib/vneid/registration.ts` (`getRegistration`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [citizenPid]
              properties:
                citizenPid:
                  type: string
                  pattern: '^[0-9]{12}$'
                  example: '001099012345'
      responses:
        '200':
          description: Yêu cầu đăng ký gần nhất, hoặc `null`.
          content:
            application/json:
              schema:
                type: object
                required: [registration]
                properties:
                  registration:
                    oneOf:
                      - $ref: '#/components/schemas/VneidRegistration'
                      - type: 'null'
        '400':
          description: Body không phải JSON hoặc số CCCD không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: |
            Thiếu `Origin` hoặc không phải trang KysoQR.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_ACCESS_DENIED]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '503':
          description: Server chưa cấu hình ký VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/status:
    post:
      tags: [Ký bằng VNeID]
      operationId: getVneidSigningStatus
      summary: Tra cứu trạng thái yêu cầu ký VNeID
      description: |
        Đọc trạng thái từ cơ sở dữ liệu của server. Khi webhook chưa mang kết quả về, server hỏi CSign (`query-status`):
        tối đa 1 lần / 5 giây / yêu cầu trong lúc người ký còn xác nhận được (5 phút + 1 phút), sau đó 1 lần / 60 giây tới `expiresAt`.
        Với `VNEID_QUERY_STATUS=off` (chỉ dùng để kiểm webhook) server không hỏi CSign: kết quả chỉ đến qua webhook.

        Poll khuyến nghị: 4 giây/lần trong 5 phút đầu, sau đó 10 giây/lần; dừng ở `SIGNED`, `FINALIZED`, `REJECTED`, `EXPIRED`, `FAILED`
        hoặc khi quá `expiresAt`; gặp `429` thì chờ theo `Retry-After`.

        | `status` | Nghĩa |
        |---|---|
        | `PENDING` | Đã gửi, CSign chưa báo thông báo tới người ký |
        | `WAITING_USER` | Đang chờ người ký xác nhận trên VNeID |
        | `SIGNED` | Đã có chữ ký; gọi `/api/vneid/finalize` |
        | `FINALIZED` | Đã tải file đã ký (vẫn tải lại được) |
        | `REJECTED` | Người ký từ chối (`reason: REFUSED`) |
        | `EXPIRED` | Quá thời gian (`reason: TIMEOUT`) |
        | `FAILED` | `reason`: `SIGNATURE_UNUSABLE` (chữ ký CSign trả về không dùng được), `CODE_ATTEMPTS`, `IDENTITY_SERVICE` (CSign không kết nối được hệ thống xác thực VNeID / TTXT: `errorcode4001`–`4003`), `PROVIDER` |

        Sai `transactionId` hay sai `clientSecret` đều trả cùng `404`. Rate limit: 120 request / phút / IP và 30 / phút / giao dịch.

        Nguồn trong code: `app/api/vneid/status/route.ts`, `lib/vneid/service.ts`.
      parameters:
        - name: Authorization
          in: header
          required: true
          description: '`Bearer <clientSecret>` nhận từ `/api/vneid/sign`.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidStatusRequest'
      responses:
        '200':
          description: Trạng thái hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidStatusResponse'
        '400':
          description: Body không phải JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_INVALID_INPUT]
        '403':
          description: |
            Thiếu `Origin` hoặc không phải trang KysoQR.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_ACCESS_DENIED]
        '404':
          description: Không có giao dịch này, hoặc sai `clientSecret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_FOUND]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/VneidInternal'
        '503':
          description: Server chưa cấu hình ký VNeID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED]

  /api/vneid/finalize:
    post:
      tags: [Ký bằng VNeID]
      operationId: finalizeVneidSigning
      summary: Ghép chữ ký VNeID và tải file PDF đã ký
      description: |
        Gửi lại **đúng file PDF gốc** (body thô `application/pdf`); server kiểm tra độ dài và SHA-256 khớp với file đã gửi ký,
        ghép chữ ký theo kiểu cập nhật nối thêm (giữ nguyên các chữ ký cũ), rồi kiểm tra lại: chữ ký mới phải hợp lệ và
        không chữ ký cũ nào bị hỏng. Không đạt thì không trả file (`500 VNEID_SELF_CHECK_FAILED`).

        **Chữ ký trong file:** cùng chuẩn với chữ ký Cas ID: `/Reason`, `/Location`, `/ContactInfo`, `/Prop_Build`
        như CAS, field tên `Signature<n>`. Hình chữ ký gồm dấu tick, tên người ký, `Ngày: dd/MM/yyyy HH:mm:ss` và `+07:00`.
        Giờ trong hình (và `/M`) là lúc gửi yêu cầu, vì hình được dựng trước khi người ký xác nhận.

        **Thời gian ký:** ở lần gọi đầu tiên, server xin dấu thời gian RFC 3161 từ TSA (`TSA_URL`, mặc định DigiCert;
        lỗi thì thử `TSA_FALLBACK_URL`, mặc định Sectigo) cho chữ ký vừa nhận và gắn vào CMS (thuộc tính không ký
        `signatureTimeStampToken`, PAdES B-T): Adobe Reader hiện giờ đó là giờ ký, chỉ cách lúc xác nhận vài giây.
        Các lần gọi sau dùng lại đúng dấu thời gian đó. Cả hai TSA đều lỗi thì file vẫn được trả, chỉ không có dấu thời gian.

        Gọi được tối đa 5 lần cho mỗi giao dịch (tải lại khi mất kết nối). Rate limit: 30 request / phút / IP.

        Nguồn trong code: `app/api/vneid/finalize/route.ts`, `lib/vneid/service.ts`, `lib/pdfSign/finalize.ts`.
      parameters:
        - name: x-vneid-tx
          in: header
          required: true
          description: '`transactionId` nhận từ `/api/vneid/sign`.'
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          required: true
          description: '`Bearer <clientSecret>`.'
          schema:
            type: string
        - name: x-vneid-code
          in: header
          required: false
          description: Mã 6 ký tự hiển thị trong tên tài liệu trên VNeID. Chỉ cần khi `codeRequired` là `true`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 'File PDF đã ký (`Content-Disposition: attachment`).'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: |
            `VNEID_FORBIDDEN_ORIGIN`: thiếu `Origin` hoặc không phải trang KysoQR.
            `VNEID_CODE_INVALID`: sai mã xác nhận; sai 5 lần thì giao dịch bị huỷ.
            `VNEID_ACCESS_DENIED`: IP không nằm trong danh sách tin tưởng `VNEID_TRUSTED_IPS`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_FORBIDDEN_ORIGIN, VNEID_CODE_INVALID, VNEID_ACCESS_DENIED]
        '404':
          description: Không có giao dịch này, hoặc sai `clientSecret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_FOUND]
        '409':
          description: |
            `VNEID_NOT_READY`: người ký chưa xác nhận.
            `VNEID_DOCUMENT_MISMATCH`: file gửi lên không phải file đã gửi ký.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_READY, VNEID_DOCUMENT_MISMATCH]
        '411':
          $ref: '#/components/responses/VneidLengthRequired'
        '413':
          $ref: '#/components/responses/VneidPayloadTooLarge'
        '415':
          $ref: '#/components/responses/VneidUnsupportedMediaType'
        '429':
          description: |
            `RATE_LIMITED`: vượt rate limit theo IP (có `Retry-After`).
            `VNEID_FINALIZE_LIMIT`: đã gọi quá 5 lần cho giao dịch này.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [RATE_LIMITED, VNEID_FINALIZE_LIMIT]
        '500':
          description: |
            `VNEID_SELF_CHECK_FAILED`: file sau khi ghép không qua bước kiểm tra nên không được trả về.
            `VNEID_INTERNAL`: lỗi khác trên server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_SELF_CHECK_FAILED, VNEID_INTERNAL]
        '503':
          description: |
            `VNEID_NOT_CONFIGURED`: server chưa cấu hình ký VNeID.
            `VNEID_BUSY`: đang xử lý nhiều file; thử lại sau vài giây.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          x-error-codes: [VNEID_NOT_CONFIGURED, VNEID_BUSY]

  /api/vneid/access:
    get:
      tags: [Ký bằng VNeID]
      operationId: getVneidAccess
      summary: Client này có được dùng VNeID không
      description: |
        Trả `allowed: true` khi IP của client nằm trong `VNEID_TRUSTED_IPS` (hoặc danh sách để trống). Trang web dùng nó để hiện hay ẩn mọi phần VNeID; các route VNeID khác tự trả `403 VNEID_ACCESS_DENIED` cho IP ngoài danh sách.

        - Danh sách có giá trị thì bắt buộc `TRUSTED_IP_HEADER`; thiếu, hoặc có mục sai định dạng, thì VNeID đóng với mọi IP.
        - Rate limit: 60 request / phút / IP.

        Nguồn trong code: `app/api/vneid/access/route.ts`, `lib/vneid/access.ts`.
      responses:
        '200':
          description: Kết quả.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed:
                    type: boolean
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/vneid/webhook:
    post:
      tags: [Ký bằng VNeID]
      operationId: receiveCsignWebhook
      summary: Nhận webhook từ CSign Gateway
      description: |
        Endpoint để **CSign** gọi (máy với máy), không dành cho trình duyệt. Đăng ký URL này ở CSign
        (`POST /api/organization/webhooks`) với các sự kiện `signing.created`, `signing.completed`, `signing.failed`.

        - Xác thực bằng HMAC-SHA256 trên **raw body**, khoá là chuỗi secret (`CSIGN_WEBHOOK_SECRET`), header
          `abp-webhook-signature: HMAC SHA256=<hex>`. Sai chữ ký → `401`.
        - `organizationId` phải là của KysoQR; `timestamp` lệch quá 30 phút → `400`. Mỗi `id` sự kiện chỉ xử lý một lần.
        - Chữ ký trong `signing.completed` chỉ được lưu khi kiểm tra toán học đúng; `signing.failed` được xác nhận lại bằng `query-status` (trừ khi `VNEID_QUERY_STATUS=off`: khi đó áp nguyên nội dung sự kiện).
        - Trả lời theo tài liệu CSign: `200 { received: true }` (kể cả sự kiện bị bỏ qua có chủ đích); lỗi `{ error, errorDescription }`.
          Chỉ `500` khiến CSign gửi lại.
        - Body tối đa 64KB. Rate limit: 300 request / phút / IP.

        Nguồn trong code: `app/api/vneid/webhook/route.ts`, `lib/vneid/webhook.ts`.
      parameters:
        - name: abp-webhook-signature
          in: header
          required: true
          description: '`HMAC SHA256=<hex>` của raw body.'
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VneidWebhookEvent'
      responses:
        '200':
          description: Đã nhận (đã xử lý, hoặc bỏ qua có chủ đích).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    const: true
        '400':
          description: '`invalid_payload`, `organization_mismatch`, `stale_event`, `payload_too_large`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '401':
          description: '`invalid_signature`: sai chữ ký HMAC.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: '`internal_error`: chưa xử lý được; CSign sẽ gửi lại.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'
        '503':
          description: '`not_configured`: server chưa cấu hình ký VNeID hoặc webhook.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VneidWebhookError'

components:
  headers:
    RetryAfter:
      description: Số giây cần chờ trước khi gửi lại. Chỉ có với `RATE_LIMITED`.
      schema:
        type: integer
        minimum: 1
      example: 3

  responses:
    TooManyRequests:
      description: Vượt rate limit của KysoQR.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR giới hạn
              value: { error: RATE_LIMITED, message: Too many requests }
      x-error-codes: [RATE_LIMITED]
    TooManyRequestsCas:
      description: |
        `RATE_LIMITED`: vượt rate limit của KysoQR (có header `Retry-After`).
        `CAS_RATE_LIMITED`: CAS giới hạn tài khoản KysoQR (không có `Retry-After`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            rate_limited:
              summary: KysoQR giới hạn
              value: { error: RATE_LIMITED, message: Too many requests }
            cas_rate_limited:
              summary: CAS giới hạn
              value: { error: CAS_RATE_LIMITED, message: CAS is rate-limiting this client }
      x-error-codes: [RATE_LIMITED, CAS_RATE_LIMITED]
    CasNotConfigured:
      description: Server thiếu biến môi trường CAS (`CAS_ESIGN_BASE_URL`, `CAS_ESIGN_CLIENT_ID`, `CAS_ESIGN_API_KEY`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            not_configured:
              summary: Thiếu cấu hình CAS
              value: { error: CAS_NOT_CONFIGURED, message: Máy chủ chưa được cấu hình đầy đủ để ký số. Vui lòng liên hệ quản trị viên. }
      x-error-codes: [CAS_NOT_CONFIGURED]
    VneidLengthRequired:
      description: Thiếu header `Content-Length` (route VNeID không đọc body không khai báo độ dài).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_LENGTH_REQUIRED]
    VneidPayloadTooLarge:
      description: Body lớn hơn giới hạn của route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_PAYLOAD_TOO_LARGE]
    VneidUnsupportedMediaType:
      description: Sai `Content-Type`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_UNSUPPORTED_MEDIA_TYPE]
    VneidInternal:
      description: Lỗi không lường trước trên server (chi tiết chỉ có trong log server).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      x-error-codes: [VNEID_INTERNAL]

  schemas:
    ApiError:
      type: object
      description: Body chung của mọi lỗi JSON.
      required: [error, message]
      properties:
        error:
          type: string
          description: Mã lỗi cố định; dùng để phân nhánh trong code. Danh sách mã của từng route nằm ở phần response tương ứng.
          example: INVALID_PDF
        message:
          type: string
          description: Thông báo cho người đọc (tiếng Việt hoặc tiếng Anh tuỳ lỗi). Không dùng để phân nhánh.
        detail:
          $ref: '#/components/schemas/CasErrorDetail'

    CasErrorDetail:
      description: Chỉ có ở lỗi 502 từ route gọi CAS. Vắng mặt khi lỗi không đến từ CAS và không phải timeout.
      oneOf:
        - title: CAS trả lỗi HTTP
          type: object
          properties:
            casErrorCode:
              type: string
              description: Mã lỗi của CAS, ví dụ `E_SIGN_CERTIFICATE_NOT_FOUND`.
            casStatus:
              type: integer
              description: HTTP status CAS trả về.
            casErrorType:
              type: string
              description: Loại lỗi của CAS.
            casRequestId:
              type: string
              description: '`requestId` của CAS, dùng khi tra soát với CAS.'
        - title: CAS không phản hồi kịp
          type: object
          required: [timeout]
          properties:
            timeout:
              type: boolean
              const: true

    SignatureFieldInput:
      type: object
      description: Một ô chữ ký. Toạ độ là tỉ lệ 0–1 so với trang, gốc ở góc trên bên trái (quy ước DOM). Server tự đổi sang quy ước của CAS.
      required: [page, xRatio, yRatio, widthRatio, heightRatio]
      properties:
        page:
          type: integer
          minimum: 1
          description: Số trang, bắt đầu từ 1.
        xRatio:
          type: number
          description: Mép trái của ô, tính từ mép trái trang. Số hữu hạn; bị kẹp về 0–1.
        yRatio:
          type: number
          description: Mép **trên** của ô, tính từ mép **trên** trang. Số hữu hạn; bị kẹp về 0–1.
        widthRatio:
          type: number
          minimum: 0.16
          maximum: 0.6
          description: Chiều rộng ô.
        heightRatio:
          type: number
          minimum: 0.055
          maximum: 0.22
          description: Chiều cao ô.

    SignRequestResponse:
      type: object
      required: [signRequestId, qrContent, state]
      properties:
        signRequestId:
          type: string
          format: uuid
          description: Mã yêu cầu ký, dùng cho `GET /api/sign/status`.
        qrContent:
          type: string
          description: Nội dung cần hiển thị thành mã QR, dạng `https://scan2grant.bankhub.vn?signToken=…`.
        state:
          type: string
          description: Trạng thái gốc từ CAS ngay sau khi tạo, thường là `NEW`.

    SignStatusResponse:
      type: object
      required: [status, rawState, signedAt, identityKeyExpiresAt]
      properties:
        status:
          type: string
          enum: [PENDING, ACCEPTED, SIGNED, REJECTED, FAILED, EXPIRED]
          description: Trạng thái đã chuẩn hoá; dùng trường này để phân nhánh.
        rawState:
          type: string
          description: 'Trạng thái gốc của CAS: `NEW`, `ACCEPTED`, `REJECTED`, `COMPLETED`.'
        signedAt:
          type: [string, 'null']
          format: date-time
          description: Thời điểm ký xong; `null` khi chưa ký xong.
        identityKey:
          type: string
          description: Khoá tải file qua `GET /api/sign/download`. Chỉ có khi `status = SIGNED`; vắng mặt trong các trường hợp khác.
        identityKeyExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Hạn dùng `identityKey`. Có giá trị khi `status = SIGNED`, còn lại `null`.
        orgIdSigned:
          type: string
          description: Mã tra cứu phiên ký cho `GET /api/verify/signing-round/{orgIdSigned}`, ví dụ `kysoqr.com#3bLzsA`. Chưa được CAS công bố chính thức; có thể vắng mặt.
        expiresIn:
          type: number
          description: Thời gian còn lại của yêu cầu ký (giây). Chưa được CAS công bố chính thức; có thể vắng mặt.

    VerifyUploadResponse:
      type: object
      required: [signatures]
      properties:
        signatures:
          type: array
          description: Mỗi phần tử ứng với 1 chữ ký, theo thứ tự trong file (cũ trước).
          items:
            $ref: '#/components/schemas/VerificationResult'

    VerificationResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [SIGNED_VALID, ROOT_NOT_TRUSTED, CONTENT_DIGEST_MISMATCH, SIGNATURE_INVALID, CHAIN_VALIDATION_FAILED, TRUST_STORE_NOT_CONFIGURED, UNSUPPORTED_SUBFILTER, UNSUPPORTED_ALGORITHM]
          description: |
            - `SIGNED_VALID`: chữ ký, nội dung và chuỗi chứng thư đều hợp lệ.
            - `ROOT_NOT_TRUSTED`: chữ ký và nội dung hợp lệ về mật mã, nhưng root CA không có trong trust store của server.
            - `CONTENT_DIGEST_MISMATCH`: nội dung đã bị sửa sau khi ký (hoặc có dữ liệu thêm sau chữ ký cuối).
            - `SIGNATURE_INVALID`: chữ ký không khớp chứng thư, cấu trúc chữ ký hỏng, hoặc lỗi bất ngờ khi xác minh chữ ký này.
            - `CHAIN_VALIDATION_FAILED`: không có chuỗi chứng thư, hoặc chuỗi không hợp lệ.
            - `TRUST_STORE_NOT_CONFIGURED`: server chưa có root CA nào trong trust store.
            - `UNSUPPORTED_SUBFILTER`: mục này dùng định dạng chưa hỗ trợ (vd dấu thời gian tài liệu `ETSI.RFC3161`). Chỉ riêng mục đó bị báo, các chữ ký khác trong file vẫn được xác minh; chỉ có `status`, `message` và có thể có `signedAt`.
            - `UNSUPPORTED_ALGORITHM`: khoá của người ký không phải RSA (vd ECDSA), chưa xác minh được; `message` nêu tên thuật toán.
        message:
          type: string
          description: Câu mô tả cố định bằng tiếng Anh ứng với `status`.
        signedAt:
          type: string
          format: date-time
          description: Lấy từ `signingTime` trong CMS; không có thì lấy từ `/M` của PDF.
        certificate:
          $ref: '#/components/schemas/VerificationCertificate'
        certificateChain:
          type: array
          description: Phần tử 0 là người ký, phần tử cuối là root; issuer của mỗi phần tử là phần tử kế tiếp.
          items:
            $ref: '#/components/schemas/ChainCertInfo'
        certificateChainRootNotInTrustStore:
          type: boolean
          const: true
          description: Chỉ có khi `status = ROOT_NOT_TRUSTED`.
        certificateExpiredNow:
          type: boolean
          description: Chứng thư đã hết hạn tính đến hiện tại. Chỉ để thông tin, không đổi `status`.
        contentIntact:
          type: boolean
          description: '`true`: nội dung chưa bị sửa sau khi ký. `false`: đã bị sửa.'
        position:
          type: integer
          minimum: 1
          description: Số thứ tự của chữ ký này trong file (chữ ký cũ nhất = 1).

    VerificationCertificate:
      type: object
      required: [subject, issuer, serialNumber, validFrom, validTo]
      properties:
        subject:
          type: string
          description: Chủ thể chứng thư (DN).
        issuer:
          type: string
          description: Đơn vị cấp (DN).
        serialNumber:
          type: string
          description: Số serial.
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time

    ChainCertInfo:
      type: object
      required: [index, subject, issuer, serialNumber, validFrom, validTo, isCa, ocsp, crl]
      properties:
        index:
          type: integer
          minimum: 0
          description: Vị trí trong chuỗi, từ 0.
        subject:
          type: string
        issuer:
          type: string
        serialNumber:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        isCa:
          type: boolean
          description: Có phải chứng thư CA không.
        ocsp:
          description: Kết quả OCSP so với issuer. `null` ở phần tử cuối (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'
        crl:
          description: Kết quả CRL so với issuer. `null` ở phần tử cuối (root).
          oneOf:
            - $ref: '#/components/schemas/RevocationCheckResult'
            - type: 'null'

    RevocationCheckResult:
      type: object
      description: Chỉ để thông tin; không bao giờ làm thay đổi `status` của chữ ký.
      required: [status, url]
      properties:
        status:
          type: string
          enum: [not_revoked, revoked, unavailable]
          description: '`unavailable` = không kiểm tra được (không có URL, lỗi mạng, phản hồi không hợp lệ); không có nghĩa là đã bị thu hồi.'
        url:
          type: [string, 'null']
          description: URL OCSP/CRL ghi trên chứng thư, có cả khi kiểm tra thất bại; `null` khi chứng thư không có URL đó.

    SigningRoundResponse:
      type: object
      required: [signingRound]
      properties:
        signingRound:
          description: '`null` khi không tìm thấy phiên ký.'
          oneOf:
            - $ref: '#/components/schemas/SigningRoundDetail'
            - type: 'null'

    SigningRoundDetail:
      type: object
      required: [device, signer, authMethod, signedAt, certificate]
      properties:
        device:
          type: object
          additionalProperties: true
          description: Thông tin thiết bị ký. CAS chưa công bố cấu trúc; coi là object key–value tuỳ ý.
        signer:
          type: object
          required: [displayName]
          properties:
            displayName:
              type: string
              description: Tên hiển thị của người ký.
        authMethod:
          type: string
          description: Phương thức xác thực người ký dùng khi ký.
        signedAt:
          type: [string, 'null']
          description: Thời điểm ký.
        certificate:
          type: object
          required: [issuer, signer, documentIntegrity, validFrom, validTo, signatureValidity, hasTimestamp, signedAtLong]
          properties:
            issuer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            signer:
              $ref: '#/components/schemas/SigningRoundCertParty'
            documentIntegrity:
              type: string
              description: 'Đánh giá toàn vẹn tài liệu phía CAS, ví dụ `Không bị thay đổi` / `Not modified`.'
            validFrom:
              type: [string, 'null']
            validTo:
              type: [string, 'null']
            signatureValidity:
              type: string
              description: 'Đánh giá hiệu lực chữ ký phía CAS, ví dụ `Hợp lệ tại thời điểm ký` / `Valid at signing time`.'
            hasTimestamp:
              type: string
              description: 'Có dấu thời gian hay không, ví dụ `Có` / `Yes`. **Là chuỗi, không phải boolean.**'
            signedAtLong:
              type: [string, 'null']
              description: Thời điểm ký, dạng đầy đủ do CAS định dạng.

    SigningRoundCertParty:
      type: object
      required: [commonName, country]
      properties:
        commonName:
          type: [string, 'null']
        organization:
          type: [string, 'null']
          description: Có thể vắng mặt.
        country:
          type: [string, 'null']
        taxOrCitizenId:
          type: [string, 'null']
          description: 'MST hoặc CCCD; có thể có tiền tố `CCCD:`/`MST:`. Có thể vắng mặt.'

    VneidSignResponse:
      type: object
      required: [transactionId, clientSecret, confirmDeadline, expiresAt, codeRequired, documentName]
      properties:
        transactionId:
          type: string
          format: uuid
        clientSecret:
          type: string
          description: Bí mật 256 bit (43 ký tự base64url). Chỉ trả về một lần; giữ ở phía trình duyệt (sessionStorage), không đưa lên URL.
        confirmDeadline:
          type: string
          format: date-time
          description: Hạn người ký xác nhận trên VNeID (5 phút).
        expiresAt:
          type: string
          format: date-time
          description: Hạn của cả giao dịch (30 phút).
        codeRequired:
          type: boolean
          description: '`true` khi phải nhập lại mã 6 ký tự hiển thị trên VNeID ở bước finalize.'
        documentName:
          type: string
          description: Tên tài liệu người ký sẽ thấy trong thông báo trên VNeID (không chứa tên file).
      example:
        transactionId: 3f0c1d8e-6b2a-4c4e-9f51-7d2a9b6c1e40
        clientSecret: q7rM2pV9wLxN4sT8kZ1bC6dF3gH5jK0aE2uY7iO9pQs
        confirmDeadline: '2026-11-04T03:20:00.000Z'
        expiresAt: '2026-11-04T03:45:00.000Z'
        codeRequired: false
        documentName: KysoQR - Ký tài liệu 1A2B3C4D

    VneidCredential:
      type: object
      description: Một chứng thư số của CCCD. Không có tên người giữ.
      required: [credentialId, usable, rootTrusted, chainVerified]
      properties:
        credentialId:
          type: string
          description: Serial của chứng thư (CSign `credentialID`); gửi lại trong `credentialId` của `/api/vneid/sign`.
        issuer:
          type: [string, 'null']
          description: Tên (CN) của CA cấp chứng thư.
        validFrom:
          type: [string, 'null']
          format: date-time
        validTo:
          type: [string, 'null']
          format: date-time
        keyBits:
          type: [integer, 'null']
        usable:
          type: boolean
          description: Dùng được để ký (qua toàn bộ kiểm tra của server).
        reason:
          type: string
          enum: [NOT_ACTIVE, EXPIRED, NOT_YET_VALID, UID_MISMATCH, KEY_UNSUPPORTED, KEY_USAGE, SERIAL_MISMATCH, CHAIN_BROKEN, MALFORMED]
          description: Vì sao không dùng được (chỉ khi `usable` là `false`).
        rootTrusted:
          type: boolean
          description: Chuỗi dẫn tới root quốc gia mà KysoQR tin cậy. `false` trên môi trường UAT (root test); chữ ký vẫn tạo được nhưng `/verify` sẽ báo root chưa được tin cậy.
        chainVerified:
          type: boolean
          description: |
            Các CA CSign gửi kèm đúng là CA đã cấp và ký chứng thư này. `false` khi CSign gửi nhầm CA
            (vd trên UAT: chứng thư do `CMC-CA RS` cấp nhưng kèm CA production `CMC-CA`). Chứng thư vẫn ký được
            (`usable`), chữ ký và nội dung file vẫn đúng, nhưng `/verify` / Adobe không xác minh được chuỗi CA.
        chainIssue:
          type: string
          enum: [issuer-not-ca, name-mismatch, signature-mismatch, ca-expired, ca-not-yet-valid]
          description: Mắt xích đầu tiên không khớp (chỉ khi `chainVerified` là `false`).
      example:
        credentialId: 2E6879BD54CA1148E4D86D05A5288DC0
        issuer: CMC-CA RS
        validFrom: '2025-07-31T11:35:06.000Z'
        validTo: '2026-07-31T11:35:06.000Z'
        keyBits: 2048
        usable: true
        rootTrusted: true

    VneidProvider:
      type: object
      description: Một nhà cung cấp chứng thư (CA) trên CSign và các gói của nó.
      required: [provider, name, packs]
      properties:
        provider:
          type: string
          description: Mã nhà cung cấp; gửi lại trong `provider` khi đăng ký.
          example: HUD-CMC-CA
        name:
          type: string
          example: CÔNG TY CỔ PHẦN TẬP ĐOÀN CÔNG NGHỆ CMC
        packs:
          type: array
          items:
            type: object
            required: [code, name, months, unitPrice, free]
            properties:
              code:
                type: string
                description: Mã gói; gửi lại trong `servicePackCode`.
                example: VNEID-FREE-12M
              name:
                type: string
              months:
                type: [integer, 'null']
                description: Thời hạn chứng thư (tháng).
              unitPrice:
                type: [number, 'null']
                description: Đơn giá (VND). Gói có phí được tính theo hợp đồng giữa đơn vị vận hành và nhà cung cấp; KysoQR không thu tiền.
              free:
                type: boolean
                description: Miễn phí (`free = 1` hoặc đơn giá 0).

    VneidRegistrationRequest:
      type: object
      required: [citizenPid, provider, servicePackCode, userInfo]
      properties:
        citizenPid:
          type: string
          pattern: '^[0-9]{12}$'
        provider:
          type: string
          example: HUD-CMC-CA
        servicePackCode:
          type: string
          example: VNEID-FREE-12M
        servicePackName:
          type: string
          description: |
            Tuỳ chọn. Tên gói đã chọn, để phân biệt khi CSign liệt kê nhiều gói cùng một mã (vd VNPT `18130`).
            Chỉ được dùng khi khớp một gói CSign liệt kê cho mã đó; CSign vẫn chỉ nhận `servicePackCode`.
        userInfo:
          type: object
          description: |
            Form đăng ký (trường của CSign `userInfo`, trừ CCCD). Bắt buộc: `fullName`, `birthDate`, `gender`, `phone`, `email`.
            Các trường còn lại tuỳ chọn: VNeID cung cấp khi người dân đồng ý chia sẻ thông tin.
          required: [fullName, birthDate, gender, phone, email]
          properties:
            fullName: { type: string, maxLength: 100 }
            birthDate: { type: string, format: date }
            gender: { type: string, enum: [Nam, Nữ] }
            phone: { type: string, example: '0912345678' }
            email: { type: string, format: email }
            nationalityCode: { type: string, pattern: '^[A-Z]{2}$', example: VN }
            issuingAuthority: { type: string, maxLength: 200 }
            dateOfIssue: { type: string, format: date }
            idCardExpireDate: { type: string, format: date }
            permanentAddress: { type: string, maxLength: 250 }
            permanentVillageText: { type: string, maxLength: 100 }
            permanentCityText: { type: string, maxLength: 100 }
            livingPlaceAddress: { type: string, maxLength: 250 }
            livingPlaceVillageText: { type: string, maxLength: 100 }
            livingPlaceCityText: { type: string, maxLength: 100 }

    VneidRegistration:
      type: object
      description: Một yêu cầu đăng ký chứng thư. Không có tên hay dữ liệu cá nhân.
      required: [status, provider, providerName, servicePackCode, servicePackName, months, unitPrice, createdAt, expiresAt]
      properties:
        status:
          type: string
          enum: [PENDING, ISSUED, COMPLETED, FAILED, REJECTED, EXPIRED]
          description: |
            `PENDING`: chờ người dân đồng ý chia sẻ thông tin trên VNeID / CA đang cấp.
            `ISSUED`: đã cấp chứng thư, chờ người dân kích hoạt trong app VNeID.
            `COMPLETED`: xong; chứng thư mới có `serialNumber` (= `credentialId`).
            `FAILED` / `REJECTED` / `EXPIRED`: kết thúc không thành công (xem `reason`).
        reason:
          type: string
          enum: [REFUSED, TIMEOUT, CITIZEN_INFO, PROVIDER]
          description: |
            Chỉ khi kết thúc không thành công. `REFUSED`: người dân từ chối chia sẻ; `TIMEOUT`: hết hạn;
            `CITIZEN_INFO`: thông tin công dân trên VNeID không hợp lệ hoặc thiếu; `PROVIDER`: lỗi phía CSign / CA.
        provider: { type: string }
        providerName: { type: string }
        servicePackCode: { type: string }
        servicePackName: { type: string }
        months: { type: [integer, 'null'] }
        unitPrice: { type: [number, 'null'] }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Lúc gửi + 30 phút (thời gian sống của một giao dịch CSign). Sau thời điểm này yêu cầu bị xoá, dù đang mở hay đã kết thúc.
        serialNumber:
          type: string
          description: Serial của chứng thư mới, là `credentialId` dùng khi ký (chỉ khi `COMPLETED`).

    VneidStatusRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          format: uuid

    VneidStatusResponse:
      type: object
      required: [status, confirmDeadline, expiresAt, codeRequired]
      properties:
        status:
          type: string
          enum: [PENDING, WAITING_USER, SIGNED, FINALIZED, REJECTED, EXPIRED, FAILED]
        reason:
          type: string
          enum: [REFUSED, TIMEOUT, SIGNATURE_UNUSABLE, CODE_ATTEMPTS, IDENTITY_SERVICE, PROVIDER]
          description: Chỉ có khi `status` là `REJECTED`, `EXPIRED` hoặc `FAILED`.
        confirmDeadline:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        codeRequired:
          type: boolean
      example:
        status: WAITING_USER
        confirmDeadline: '2026-11-04T03:20:00.000Z'
        expiresAt: '2026-11-04T03:45:00.000Z'
        codeRequired: false

    VneidWebhookEvent:
      type: object
      description: Sự kiện CSign gửi (tài liệu CSign Gateway v1.11, mục IV.4). Trường lạ được bỏ qua.
      required: [id, eventName, timestamp, organizationId, data]
      properties:
        id:
          type: string
          description: Mã sự kiện; mỗi mã chỉ được xử lý một lần.
        eventName:
          type: string
          example: signing.completed
        timestamp:
          type: string
          format: date-time
        organizationId:
          type: string
        data:
          type: object
          description: Với `signing.*`.
          properties:
            transactionId:
              type: string
              description: Mã giao dịch CSign (`sign-hash` trả về).
            documentNumber:
              type: [string, 'null']
            providerTransactionId:
              type: [string, 'null']
              description: Phải khớp `rscaTransactionId` của `sign-hash`.
            providerInternalId:
              type: [string, 'null']
            status:
              type: integer
              description: 0 thất bại, 1 đã tạo, 2 đang xử lý, 3 chờ xác nhận VNeID, 4 thành công, 5 người dùng từ chối.
            statusDescription:
              type: [string, 'null']
            signatures:
              type: [array, 'null']
              items:
                type: object
                properties:
                  documentId:
                    type: [string, 'null']
                  signature:
                    type: [string, 'null']
                    description: Chữ ký base64.
            errorCode:
              type: [string, 'null']
              example: errorcode4004

    VneidWebhookError:
      type: object
      description: Định dạng lỗi theo tài liệu webhook của CSign.
      required: [error, errorDescription]
      properties:
        error:
          type: string
        errorDescription:
          type: string
